<!DOCTYPE html>
<html lang="nl" data-theme="auto">
<head>
<meta charset="UTF-8">
<!-- Zoom toegestaan (a11y/WCAG): geen maximum-scale / user-scalable=no meer -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">

<meta name="description" content="Boodschappenlijst die je samen bijhoudt — offline, met winkelmodus, vaste boodschappen en paklijsten.">
<meta property="og:title" content="Mandje">
<meta property="og:description" content="Boodschappenlijst die je samen bijhoudt — offline, met winkelmodus en vaste boodschappen.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://floriandelange12.github.io/mandje/icon-512.png">

<!-- PWA / iPhone -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mandje">

<style>
  @font-face{
    font-family:"Fraunces";
    src:url(data:font/woff2;base64,__FONT__) format("woff2");
    font-weight:500 700; font-style:normal; font-display:swap;
  }
  :root{
    /* ===== Kleur — "marktkraam op papier" (ratio's: tekst-op-vlak, WCAG 2.x; bewaakt door tests/contrast.js) ===== */
    --bg:#F3EDE3;              /* kraft-crème pagina */
    --surface-1:#FFFCF7;       /* kaart (niveau 1) */
    --surface-2:#FAF6EE;       /* tonaal óp een kaart (chips, inputs, done-kaart) */
    --surface-3:#E8DFCF;       /* tonaal óp de pagina (seg, qty, search) — dieper dan bg */
    --ink:#1F1B15;             /* 14,7:1 op bg */
    --ink-soft:#5A5347;        /* 6,5:1 op bg */
    --ink-faint:#675F51;       /* 5,3:1 op bg · 4,7:1 op surface-3 (was 2,3:1) */
    --ink-decorative:#B0A796;  /* alleen grip/chevrons/stippen — nooit tekst */
    --line:#D9CFBC;            /* hairline tussen group-rijen */
    --line-strong:#C9BEAA;     /* input-rand in rust */
    --line-control:#8F8676;    /* rand van check/switch-uit (≥3:1) */
    --brand:#24593F;           /* Laurier — 7,0:1 als tekst op bg */
    --brand-strong:#1C4A33;    /* hover/active */
    --brand-2:#DCEADF;         /* tint-vlak; brand-tekst erop 6,6:1 */
    --on-brand:#FFFFFF;        /* 8,2:1 op brand */
    --accent:#8A5410;          /* Honing — 'bijna op'; 5,4:1 op bg */
    --accent-2:#F6E7C9;
    --on-accent:#FFFFFF;       /* 6,3:1 op accent */
    --danger:#B0392A;          /* Paprika — 'op' / verwijderen; 5,2:1 op bg */
    --danger-2:#F8DED9;
    --on-danger:#FFFFFF;       /* 6,1:1 op danger */
    --focus:#2A6B4B;           /* ring 5,5:1 op bg */
    --scrim:rgba(31,27,21,.42);
    --scrim-panel:rgba(31,27,21,.25);
    --glass:color-mix(in srgb, var(--surface-1) 84%, transparent);
    --blur:saturate(160%) blur(18px);
    /* Elevatie: warm-getinte schaduwen (licht); in donker lichtere laag + inset-hairline */
    --shadow-tint:46,36,20;
    --el-0:none;
    --el-1:0 1px 1px rgba(var(--shadow-tint),.04), 0 2px 6px -2px rgba(var(--shadow-tint),.09);
    --el-2:0 2px 4px rgba(var(--shadow-tint),.05), 0 10px 24px -8px rgba(var(--shadow-tint),.16);
    --el-3:0 4px 10px rgba(var(--shadow-tint),.06), 0 24px 48px -12px rgba(var(--shadow-tint),.26);
    --el-4:0 8px 16px rgba(var(--shadow-tint),.08), 0 32px 64px -16px rgba(var(--shadow-tint),.34);
    --shadow-sheet:0 -10px 40px rgba(var(--shadow-tint),.18);
    /* Schap-tinten (6 groepen): tint = bubbel-achtergrond, ink = icoon/label (≥5,9:1 op tint) */
    --shelf-vers-tint:#DCEADF;  --shelf-vers-ink:#24593F;
    --shelf-graan-tint:#F3E4C6; --shelf-graan-ink:#6E4A0E;
    --shelf-koel-tint:#DCE8EF;  --shelf-koel-ink:#2B5468;
    --shelf-eiwit-tint:#F4DED6; --shelf-eiwit-ink:#8A3B2A;
    --shelf-zorg-tint:#E7E0EF;  --shelf-zorg-ink:#553B78;
    --shelf-huis-tint:#E8E2D8;  --shelf-huis-ink:#4E473D;
    --member-text-mix:0%;      /* lidkleur als tekst: licht puur */
    --toast-bg:var(--ink); --toast-ink:var(--bg); --toast-action:#9FD9B8;   /* 10,7:1 op ink */

    /* ===== Typografie ===== */
    --font:"Avenir Next","Nunito","Segoe UI","SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif;
    --display:"Fraunces", ui-serif, Georgia, "Times New Roman", serif;   /* alleen titels, sheet-koppen, grote bedragen */
    --mono:ui-monospace, SFMono-Regular, Menlo, monospace;
    --fs-xs:clamp(0.75rem, 0.72rem + 0.15vw, 0.8125rem);    /* 12→13 badges, labels */
    --fs-sm:clamp(0.8125rem, 0.78rem + 0.20vw, 0.875rem);   /* 13→14 meta, hints, sectiekop */
    --fs-md:clamp(0.9375rem, 0.90rem + 0.30vw, 1rem);       /* 15→16 chips, seg, knoppen */
    --fs-base:clamp(1rem, 0.96rem + 0.35vw, 1.0625rem);     /* 16→17 body, item-naam, labels */
    --fs-lg:clamp(1.0625rem, 1.00rem + 0.40vw, 1.125rem);   /* 17→18 ctitle, shop-naam, primaire knop */
    --fs-xl:clamp(1.25rem, 1.15rem + 0.60vw, 1.375rem);     /* 20→22 bedragen, intro-kop */
    --fs-2xl:clamp(1.5rem, 1.30rem + 1.00vw, 1.75rem);      /* 24→28 sheet-h3, empty-h2, shop-titel */
    --fs-3xl:clamp(1.75rem, 1.40rem + 1.80vw, 2.25rem);     /* 28→36 h1 */
    --fs-input:max(1rem, var(--fs-base));                   /* nooit <16px op mobiel (iOS-zoom) */
    --fw-regular:400; --fw-medium:500; --fw-bold:700;
    --lh-display:1.08; --lh-heading:1.2; --lh-body:1.4; --lh-relaxed:1.5;
    --ls-display:-0.015em; --ls-heading:-0.01em; --ls-label:0.06em; --ls-num:-0.01em;
    --text-scale:1;                                         /* instelling Tekstgrootte (1 / 1.12 / 1.25) */

    /* ===== Maat, ruimte, radius ===== */
    --sp-1:0.25rem; --sp-2:0.5rem; --sp-3:0.75rem; --sp-4:1rem; --sp-5:1.25rem; --sp-6:1.5rem; --sp-8:2rem; --sp-10:2.5rem; --sp-12:3rem;
    --r-xs:6px; --r-sm:10px; --r-md:14px; --r-lg:18px; --r-xl:24px; --r-pill:999px;
    --icon-sm:18px; --icon-md:24px; --icon-lg:28px; --icon-hero:48px;
    --tap:clamp(44px, 12vw, 48px);
    --tap-sm:clamp(36px, 8.5vw, 40px);
    --app-max-width:min(600px, calc(100vw - 24px));
    --app-padding:clamp(12px, 3vw, 18px);
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
    --totals-space:184px;

    /* ===== Motion ===== */
    --dur-instant:80ms; --dur-fast:140ms; --dur-base:220ms; --dur-slow:320ms; --dur-flip:380ms; --dur-fade:120ms; --dur-celebrate:900ms;
    --ease-out:cubic-bezier(.2,.7,.1,1);
    --ease-in:cubic-bezier(.4,0,1,1);
    --ease-inout:cubic-bezier(.65,0,.35,1);
    --ease-spring:cubic-bezier(.34,1.4,.64,1);
    --press:scale(.96);

    /* ===== Legacy-aliassen (tijdens de migratie; daarna verwijderen) ===== */

    --tap-size:var(--tap); --tap-size-sm:var(--tap-sm);

  }
  @supports (animation-timing-function: linear(0, 1)){
    :root{ --ease-spring:linear(0,.012 1.4%,.05 3%,.19 6.2%,.47 10.4%,.72 14.2%,.9 17.6%,1.03 21%,1.1 24.6%,1.13 28.4%,1.12 32.6%,1.08 38%,1.02 45%,.99 52%,.985 60%,1 100%); }
  }
  html[data-theme="dark"]{
    --bg:#15130F; --surface-1:#211D17; --surface-2:#29241D; --surface-3:#332D25;
    --ink:#F1ECE2; --ink-soft:#B3AA99; --ink-faint:#A0977F; --ink-decorative:#5E574C;
    --line:#332E26; --line-strong:#3D372E; --line-control:#7A7264;
    --brand:#8FD1A8; --brand-strong:#A8DEBC; --brand-2:#1E3328; --on-brand:#0E1F16;
    --accent:#E9B65C; --accent-2:#33291A; --on-accent:#201400;
    --danger:#F2917F; --danger-2:#3A1F1B; --on-danger:#2A0E0A;
    --focus:#8FD1A8;
    --scrim:rgba(0,0,0,.62); --scrim-panel:rgba(0,0,0,.45);
    --glass:color-mix(in srgb, var(--surface-2) 84%, transparent);
    --shadow-tint:0,0,0;
    --el-1:0 1px 2px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.035);
    --el-2:0 2px 6px rgba(0,0,0,.40), 0 12px 28px -10px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.05);
    --el-3:0 6px 14px rgba(0,0,0,.45), 0 28px 56px -12px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.06);
    --el-4:0 10px 20px rgba(0,0,0,.50), 0 36px 72px -16px rgba(0,0,0,.70), inset 0 1px 0 rgba(255,255,255,.07);
    --shadow-sheet:0 -14px 48px rgba(0,0,0,.55);
    --shelf-vers-tint:#1E3328;  --shelf-vers-ink:#8FD1A8;
    --shelf-graan-tint:#33291A; --shelf-graan-ink:#E4B86B;
    --shelf-koel-tint:#1B2A33;  --shelf-koel-ink:#8FC4DC;
    --shelf-eiwit-tint:#35221D; --shelf-eiwit-ink:#F0A28E;
    --shelf-zorg-tint:#2A2334;  --shelf-zorg-ink:#C3ACE0;
    --shelf-huis-tint:#2B2822;  --shelf-huis-ink:#B9B0A1;
    --member-text-mix:45%;
    --toast-action:#24593F;    /* 6,9:1 op ink */
  }
  @media (prefers-reduced-motion: reduce){
    :root{ --dur-instant:0ms; --dur-fast:0ms; --dur-base:1ms; --dur-slow:1ms; --dur-flip:0ms; --dur-celebrate:0ms; --ease-spring:var(--ease-out); }
    /* --dur-fade blijft: essentiële feedback (sheet/scrim/toast/vinkje) als korte cross-fade */
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  html{ font-size:calc(100% * var(--text-scale, 1)); }
  body{
    font-family:var(--font); background:var(--bg); color:var(--ink);
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    overscroll-behavior-y:none; -webkit-user-select:none; user-select:none;
    -webkit-text-size-adjust:100%; text-size-adjust:100%;
    font-size:var(--fs-base); line-height:var(--lh-body); font-weight:var(--fw-regular);
    transition:background-color var(--dur-fast) var(--ease-inout), color var(--dur-fast) var(--ease-inout);
  }
  /* Zachte thema-overgang op de grote vlakken (licht ↔ donker) */
  .group, .topbar, .banner, .totals-inner, .seg, .seg button{ transition:background-color var(--dur-fast) var(--ease-inout), color var(--dur-fast) var(--ease-inout), border-color var(--dur-fast) var(--ease-inout); }
  input,button,select,textarea{font-family:var(--font); color:inherit;}
  /* Cross-platform input-reset: weg met iOS' standaard inner-shadow/afronding + Android-tics */
  input[type="text"],input[type="search"],input[type="email"],input[type="url"],input[type="tel"],input[type="number"],input:not([type]),textarea{
    -webkit-appearance:none; appearance:none; background-clip:padding-box;
  }
  button{cursor:pointer; min-height:var(--tap-size-sm);}
  ::placeholder{color:var(--ink-faint); opacity:1;}
  /* Autofill (iOS Safari + Chrome/Android): voorkom de gele/blauwe achtergrond.
     De ultralange transition zorgt dat de browser-achtergrond nooit zichtbaar "inverft";
     text-fill-color houdt de tekst leesbaar — ook in dark mode. */
  input:-webkit-autofill,
  input:-webkit-autofill:hover,
  input:-webkit-autofill:focus,
  input:-webkit-autofill:active,
  textarea:-webkit-autofill,
  select:-webkit-autofill{
    -webkit-text-fill-color:var(--ink) !important;
    caret-color:var(--ink);
    transition:background-color 100000s ease-in-out 0s !important;
    font-family:var(--font) !important;
  }
  /* Toetsenbord-focus: één ring (outline wordt niet geclipt door overflow); alleen bij :focus-visible, nooit bij tik/klik */
  :focus{ outline:none; }
  :focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }
  .card:focus-visible, .shop-row:focus-visible, .ls-item:focus-visible, .sa-row:focus-visible, .section.collapsible:focus-visible{ outline-offset:-2px; }
  input:focus-visible, textarea:focus-visible{ outline:none; }
  .sheet:focus-visible, .shop-screen:focus-visible, .send-screen:focus-visible, .sheet2:focus-visible{ outline:none; }
  .sheet input.txt:focus, .sheet input.num:focus, .inline-rename input:focus,
  textarea.io:focus, .quick-create input:focus{
    border-color:var(--brand);
    box-shadow:0 0 0 3px var(--brand-2);
  }
  .search-bar:focus-within{ box-shadow:0 0 0 3px var(--brand-2); }

  .app{
    width:min(100%, var(--app-max-width));
    max-width:var(--app-max-width);
    margin:0 auto;
    height:100%;
    position:relative;
    overflow:hidden;
    z-index:1;
  }
  .sheet,
  .send-screen,
  .shop-screen,
  .totals,
  .totals-inner,
  .addwrap{
    width:min(100%, var(--app-max-width));
    max-width:var(--app-max-width);
    margin-inline:auto;
  }
  .sheet{
    left:50%;
    right:auto;
    transform:translateX(-50%);
  }
  .send-screen,
  .shop-screen{
    left:0;
    right:0;
    transform:none;
  }
  .totals{ left:0; right:0; transform:none; }   /* centrering komt van .totals-inner (width + margin-inline:auto) */
  body::before{ content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(130% 70% at 50% -15%, color-mix(in srgb, var(--brand) 6%, transparent), transparent 58%),
      radial-gradient(90% 50% at 85% 8%, color-mix(in srgb, var(--accent) 4%, transparent), transparent 60%);
  }
  html[data-theme="dark"] body::before{
    background:
      radial-gradient(130% 70% at 50% -15%, color-mix(in srgb, var(--brand) 10%, transparent), transparent 55%),
      radial-gradient(90% 50% at 85% 8%, color-mix(in srgb, var(--accent) 6%, transparent), transparent 60%);
  }

  /* ---------- Top bar (compact title) ---------- */
  .topbar{
    position:absolute; top:0; left:0; right:0; z-index:30;
    padding-top:var(--safe-t); height:calc(var(--safe-t) + 50px);
    width:min(100%, var(--app-max-width));
    left:50%;
    transform:translateX(-50%);
    display:flex; align-items:center; justify-content:center;
    background:transparent; transition:background var(--dur-fast) var(--ease-inout), border-color var(--dur-fast) var(--ease-inout);
    border-bottom:.5px solid transparent;
  }
  .topbar.scrolled{ background:var(--glass); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); border-bottom-color:var(--line); transition:background var(--dur-instant) var(--ease-inout), border-color var(--dur-instant) var(--ease-inout); }
  .topbar .ctitle{ font-size:var(--fs-lg); font-weight:var(--fw-bold); letter-spacing:-.01em; opacity:0; transform:translateY(2px); transition:opacity var(--dur-base) var(--ease-inout), transform var(--dur-base) var(--ease-inout); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:56vw; }
  .topbar.scrolled .ctitle{ opacity:1; transform:none; }

  /* ---------- Scroll area ---------- */
  main{
    position:absolute;
    inset:0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding-left:max(var(--app-padding), env(safe-area-inset-left));
    padding-right:max(var(--app-padding), env(safe-area-inset-right));
    transition:bottom var(--dur-base) var(--ease-inout);
  }
  main::-webkit-scrollbar{ display:none; }
  /* Met prijzen aan: scrollgebied eindigt net boven de totaalbalk zodat die nooit items afdekt */
  body.has-total #main{ bottom:calc(max(16px, var(--safe-b)) + var(--totals-space)); }
  /* Floating add-bar = ~62px hoog; extra ruimte onderaan zodat items niet verdwijnen (geen tabbar meer) */
  .pad-bottom{ height:calc(var(--safe-b) + 96px); }
  /* Klein: het ingekorte #main (body.has-total) reserveert de ruimte voor de balk al */
  .pad-bottom.with-total{ height:clamp(18px, 4vh, 24px); }
  /* Op Vaste/Meer-tabs is add-bar verborgen — alleen safe-area onderaan */
  body.no-addbar .pad-bottom{ height:calc(var(--safe-b) + 24px); }
  body.no-addbar .pad-bottom.with-total{ height:calc(var(--safe-b) + 24px); }

  .largehead{ padding:calc(var(--safe-t) + 54px) 4px 6px; }
  h1{ font-family:var(--display); font-size:var(--fs-3xl); line-height:var(--lh-display); font-weight:var(--fw-medium); letter-spacing:var(--ls-display); margin:2px 0 3px; transition:opacity var(--dur-base) var(--ease-out); word-break:break-word; }
  .largehead[data-loading] h1{ opacity:0; }
  h1.has-dot{ display:flex; align-items:center; gap:12px; }
  h1.has-dot::before{ content:""; width:14px; height:14px; border-radius:50%; background:var(--list-dot,transparent); flex:0 0 auto; box-shadow:0 0 0 1px color-mix(in srgb, var(--list-dot,transparent) 35%, transparent); }
  .subhead{ font-size:var(--fs-sm); color:var(--ink-soft); white-space:normal; overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .topbar .ctitle.has-dot{ display:inline-flex; align-items:center; gap:8px; }
  .topbar .ctitle.has-dot::before{ content:""; width:9px; height:9px; border-radius:50%; background:var(--list-dot,transparent); flex:0 0 auto; }
  .topbar .gear{ position:absolute; right:max(8px, env(safe-area-inset-right)); top:calc(var(--safe-t) + 7px); width:var(--tap-size-sm); height:var(--tap-size-sm); border:0; background:transparent; color:var(--ink-soft); display:flex; align-items:center; justify-content:center; border-radius:50%; transition:background var(--dur-fast) var(--ease-inout), color var(--dur-fast) var(--ease-inout); }
  .topbar .gear svg{ width:23px; height:23px; }
  .topbar .gear:active{ background:var(--surface-3); }
  .topbar .share-top{ position:absolute; right:calc(max(8px, env(safe-area-inset-right)) + var(--tap-size-sm)); top:calc(var(--safe-t) + 7px); width:var(--tap-size-sm); height:var(--tap-size-sm); border:0; background:transparent; color:var(--ink-soft); display:none; align-items:center; justify-content:center; border-radius:50%; transition:background var(--dur-fast) var(--ease-inout), color var(--dur-fast) var(--ease-inout); }
  .topbar .share-top.show{ display:flex; }
  .topbar .share-top svg{ width:21px; height:21px; }
  .topbar .share-top:active{ background:var(--surface-3); }
  .topbar .offline-badge{ position:absolute; left:max(12px, env(safe-area-inset-left)); top:calc(var(--safe-t) + 14px); display:none; align-items:center; gap:5px; padding:3px 10px; background:color-mix(in srgb, var(--accent) 18%, var(--surface-1)); border:1px solid color-mix(in srgb, var(--accent) 35%, transparent); color:var(--accent); border-radius:var(--r-pill); font-size:var(--fs-xs); font-weight:var(--fw-bold); letter-spacing:.02em; pointer-events:none; }
  .topbar .offline-badge.show{ display:inline-flex; }
  .topbar .offline-badge::before{ content:""; width:6px; height:6px; border-radius:50%; background:var(--accent); }

  html,body{ overflow:hidden; }

  /* ---------- Add bar (floating, one-handed) ---------- */
  /* --kb-lift wordt door JS op de toetsenbord-hoogte gezet (visualViewport).
     Alleen de balk beweegt mee — de rest van de app blijft staan = geen scherm-sprong. */
  .addwrap{
    position:fixed;
    left:max(12px, env(safe-area-inset-left));
    right:max(12px, env(safe-area-inset-right));
    bottom:calc(max(var(--app-padding), var(--safe-b)) + 14px);
    z-index:29;
    padding:0;
    background:transparent;
    transition:bottom var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-out), opacity var(--dur-base) var(--ease-inout);
  }
  /* Toetsenbord open: balk zakt naar net boven de toetsenbord-rand; totals weg */
  body.kb-open .addwrap{ bottom:calc(var(--kb-lift, 0px) + 10px); }
  body.kb-open .totals{ opacity:0; pointer-events:none; }
  /* Verbergen wanneer item-sheet open is zodat 'ie geen overlap geeft */
  body.sheet-open .addwrap{ transform:translateY(140%); opacity:0; pointer-events:none; }
  .field{ display:flex; align-items:center; width:100%; min-width:0; background:var(--surface-1); border:0; border-radius:var(--r-lg); padding:clamp(4px, 1vw, 5px); box-shadow:var(--el-2); transition:border-color var(--dur-fast) var(--ease-inout), box-shadow var(--dur-fast) var(--ease-inout), background-color var(--dur-fast) var(--ease-inout), color var(--dur-fast) var(--ease-inout); }
  .field:focus-within{ box-shadow:var(--el-2), 0 0 0 3px var(--brand-2); }

  /* Autocomplete (opent naar boven omdat add-bar onderaan zit) */

  /* ---------- Sections & rows ---------- */
  .section{ display:flex; align-items:center; gap:8px; margin:20px 6px 8px; font-size:var(--fs-sm); font-weight:var(--fw-bold); letter-spacing:.04em; text-transform:uppercase; color:var(--ink-soft); }

  .row .behind{ position:absolute; inset:1px; border-radius:calc(var(--r-lg) - 1px); background:var(--danger); opacity:0; display:flex; align-items:center; justify-content:flex-end; gap:8px; padding-right:22px; color:var(--on-danger); font-weight:var(--fw-medium); font-size:var(--fs-md); transition:opacity .12s linear; }

  .check::before{ content:""; position:absolute; inset:-6px; }
  .check svg{ width:19px; height:19px; opacity:0; transform:scale(.3); transition:opacity var(--dur-fast) var(--ease-out), transform var(--dur-base) var(--ease-out); }
  .row.done .check{ background:var(--brand); border-color:var(--brand); }

  .meta{ flex:1; min-width:0; }
  .nm{ font-size:var(--fs-base); font-weight:var(--fw-medium); letter-spacing:-.01em; white-space:normal; overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; transition:color var(--dur-fast) var(--ease-inout), text-decoration-color var(--dur-base) var(--ease-out); text-decoration:line-through; text-decoration-color:transparent; text-decoration-thickness:1.5px; }

  /* catalogusbeheer */
  .cm-list{ margin:0 -4px; }
  .cm-row{ display:flex; align-items:center; gap:10px; padding:10px 6px; border-bottom:1px solid var(--line); }
  .cm-row.hidden-entry .cm-title{ opacity:.55; text-decoration:line-through; }
  .cm-name{ flex:1; min-width:0; }
  .cm-title{ font-size:var(--fs-base); font-weight:var(--fw-medium); white-space:normal; overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .cm-meta{ font-size:var(--fs-xs); color:var(--ink-faint); }

  .banner{ background:linear-gradient(135deg, var(--accent-2), color-mix(in srgb, var(--accent-2) 60%, var(--surface-1))); border:1px solid color-mix(in srgb, var(--accent) 22%, transparent); border-radius:var(--r-lg); padding:14px; }
  .banner .b-top{ display:flex; align-items:center; gap:8px; font-weight:var(--fw-bold); font-size:var(--fs-md); color:var(--accent); margin-bottom:10px; }

  /* Vaste-tab card */
  .vrow{ display:flex; align-items:center; gap:13px; background:var(--surface-1); border:0; border-radius:var(--r-lg); padding:clamp(11px, 2.8vw, 13px) clamp(12px, 2.8vw, 14px); box-shadow:var(--el-1); }

  /* Empty state */

  .empty p{ font-size:var(--fs-md); margin:0; line-height:1.5; }

  /* ---------- Totals bar (boven floating add-bar) ---------- */
  .totals{ position:absolute; left:0; right:0; bottom:calc(max(16px, var(--safe-b)) + 90px); z-index:25; padding:0 max(12px, env(safe-area-inset-right)) 8px max(12px, env(safe-area-inset-left)); pointer-events:none; transition:opacity var(--dur-base) var(--ease-inout), transform var(--dur-base) var(--ease-inout), visibility 0s; }
  /* visibility:hidden haalt 'm uit de a11y-tree én tab-volgorde wanneer verborgen;
     0s-delay-na-transitie zodat de fade-out nog zichtbaar afspeelt */
  .totals.hide{ opacity:0; transform:translateY(8px); pointer-events:none; visibility:hidden; transition:opacity var(--dur-base) var(--ease-inout), transform var(--dur-base) var(--ease-inout), visibility 0s linear var(--dur-base); }
  .totals-inner{ background:var(--glass); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); border:0; border-radius:var(--r-lg); box-shadow:var(--el-2); padding:9px 16px 10px; pointer-events:auto; }
  .trow{ display:flex; align-items:center; justify-content:space-between; gap:10px; }

  .trow .amt{ font-family:var(--display); font-size:var(--fs-xl); font-weight:var(--fw-medium); letter-spacing:var(--ls-num); line-height:1; font-variant-numeric:tabular-nums; }

  .trow .cart, #t-prog-wrap .cart{ flex:0 0 auto; font-size:var(--fs-xs); font-weight:var(--fw-medium); color:var(--brand); white-space:nowrap; }
  .finish{ border:0; background:var(--brand); color:var(--on-brand); font-weight:var(--fw-bold); font-size:var(--fs-md); padding:8px 14px; border-radius:var(--r-md); transition:transform var(--dur-instant) var(--ease-out); }

  .forgot-row .forgot-pill{ display:inline-flex; align-items:center; gap:5px; padding:5px 10px; background:var(--accent-2); color:var(--accent); border:0; border-radius:var(--r-pill); font-size:var(--fs-sm); font-weight:var(--fw-bold); transition:transform var(--dur-instant) var(--ease-out); }
  .forgot-row .forgot-pill:active{ transform:var(--press); filter:brightness(.96); }

  .finish-inline-btn:active{ transform:var(--press); filter:brightness(.94); }

  /* ---------- Lijst/Vaste-segment (onder de titel) ---------- */

  .view-seg button{ border:0; background:transparent; padding:8px 22px; border-radius:var(--r-sm); font-size:var(--fs-md); font-weight:var(--fw-medium); color:var(--ink-soft); transition:color var(--dur-fast) var(--ease-inout), background var(--dur-fast) var(--ease-inout), box-shadow var(--dur-fast) var(--ease-inout); }
  .view-seg button.on{ background:var(--surface-1); color:var(--ink); box-shadow:var(--el-1); }

  /* ---------- Views ---------- */
  .view{ display:none; }
  .view.active{ display:block; animation:viewSlideIn var(--dur-base) var(--ease-out); }
  @keyframes viewSlideIn{ from{ opacity:0; transform:translateY(-6px);} to{ opacity:1; transform:none;} }

  /* ---------- Settings (Meer) ---------- */
  .group{ background:var(--surface-1); border:0; border-radius:var(--r-lg); overflow:hidden; box-shadow:var(--el-1); margin-bottom:18px; }
  .grow{ display:flex; align-items:center; gap:12px; padding:14px 16px; border-bottom:1px solid var(--line); }
  .grow:last-child{ border-bottom:0; }
  .grow > :first-child{ flex:1; min-width:0; }   /* label-blok vult altijd de rij, ongeacht de markup-vorm (schakelaars op één lijn) */
  .grow .glabel{ flex:1; font-size:var(--fs-base); font-weight:var(--fw-medium); }
  .grow .gsub{ font-size:var(--fs-sm); color:var(--ink-soft); margin-top:2px; }
  .seg{ display:flex; background:var(--surface-3); border-radius:var(--r-sm); padding:2px; }
  .seg button{ border:0; background:transparent; padding:6px 12px; border-radius:var(--r-sm); font-size:var(--fs-md); font-weight:var(--fw-medium); color:var(--ink-soft); }
  .seg button.on{ background:var(--surface-1); color:var(--ink); box-shadow:var(--el-1); }
  .switch{ width:50px; height:30px; border-radius:var(--r-pill); background:var(--surface-3); border:1px solid var(--line-control); position:relative; transition:background-color var(--dur-base) var(--ease-inout), border-color var(--dur-base) var(--ease-inout); flex:0 0 auto; }
  .switch.on{ background:var(--brand); border-color:transparent; }
  .switch::after{ content:""; position:absolute; top:2px; left:2px; width:24px; height:24px; border-radius:50%; background:var(--surface-1); box-shadow:0 1px 3px rgba(0,0,0,.3); transition:transform var(--dur-base) var(--ease-spring); }
  .switch.on::after{ background:var(--on-brand); }
  .switch.on::after{ transform:translateX(20px); }
  .mbtn{ width:100%; border:0; background:var(--surface-1); border-radius:var(--r-md); padding:14px; font-size:var(--fs-base); font-weight:var(--fw-medium); box-shadow:var(--el-1); margin-bottom:10px; min-height:var(--tap-size); }
  .mbtn.danger{ color:var(--danger); }
  .mbtn.primary{ background:var(--brand); color:var(--on-brand); }
  .mbtn.primary:active{ filter:brightness(.94); background:var(--brand); }
  .mbtn:active{ background:var(--surface-3); }
  /* Kleur-kiezer chip (profiel) */
  .color-chip{ width:34px; height:34px; border-radius:50%; padding:0; border:0; flex:0 0 auto; }
  .color-chip.on{ outline:3px solid var(--ink); outline-offset:2px; }
  /* Gedeelde meta/ellipsis in lijst-/vrienden-rijen */
  .lsi-meta{ flex:1; min-width:0; }
  .lsi-text{ white-space:normal; overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  /* Avatar (initialen of emoji) */
  .avatar{ border-radius:50%; display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .av.offline{ opacity:.5; }
  textarea.io{ width:100%; height:120px; border:1px solid var(--line-strong); border-radius:var(--r-md); background:var(--surface-2); padding:12px; font-size:var(--fs-sm); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; resize:none; -webkit-user-select:text; user-select:text; }
  .hint{ font-size:var(--fs-sm); color:var(--ink-soft); line-height:1.5; margin:2px 6px 16px; }
  .grow .gval{ margin-left:auto; flex:0 0 auto; color:var(--ink-soft); font-size:var(--fs-md); font-variant-numeric:tabular-nums; }
  .grow .gval.ok{ color:var(--brand); font-weight:var(--fw-bold); }
  .grow.wrap{ flex-wrap:wrap; } .grow.wrap .glabel{ flex:1 1 auto; } .grow.wrap .seg{ margin-left:auto; }   /* segment mag op een smal scherm onder het label */
  .mbtn.inline{ width:auto; flex:0 0 auto; margin:0 0 0 auto; padding:10px 16px; min-height:var(--tap-size-sm); background:var(--brand); color:var(--on-brand); box-shadow:none; }
  .gsub b{ font-weight:var(--fw-bold); color:var(--ink); }

  /* ---------- Bottom sheet ---------- */
  .scrim{ position:absolute; inset:0; background:var(--scrim); opacity:0; z-index:50; transition:opacity var(--dur-slow) var(--ease-out); pointer-events:none; }
  .scrim.show{ opacity:1; pointer-events:auto; }
  .sheet{ position:absolute; left:0; right:0; bottom:0; z-index:51; background:var(--surface-1); border-radius:var(--r-xl) var(--r-xl) 0 0; box-shadow:var(--shadow-sheet); transform:translateY(110%); visibility:hidden; transition:transform var(--dur-slow) var(--ease-out), visibility 0s linear var(--dur-slow); --sheet-pad-x:18px; --sheet-pad-b:calc(18px + var(--safe-b)); padding:8px var(--sheet-pad-x) var(--sheet-pad-b); width:min(100%, var(--app-max-width)); max-width:var(--app-max-width); margin:0 auto; max-height:calc(100% - 80px); overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
  /* Gesloten sheet uit a11y-tree + tab-volgorde halen; visibility springt direct aan bij openen,
     en pas ná de slide-down-animatie weer uit (0s-delay) zodat de animatie zichtbaar blijft */
  .sheet.show{ transform:none; visibility:visible; transition:transform var(--dur-slow) var(--ease-out), visibility 0s; }
  /* Toetsenbord open (iOS-PWA): sheet schuift mee omhoog met --kb-lift (app.js); Android meet kb≈0 → geen dubbele lift */
  body.kb-open .sheet{ bottom:var(--kb-lift, 0px); max-height:calc(100% - var(--kb-lift, 0px) - 40px); }
  #scrim2{ z-index:52; }
  #sheet2{ z-index:53; }
  .grip{ width:36px; height:4px; border-radius:var(--r-pill); background:var(--ink-decorative); margin:6px auto 14px; transition:background var(--dur-fast) var(--ease-inout); }
  .sheet h3{ font-family:var(--display); font-size:var(--fs-2xl); font-weight:var(--fw-medium); letter-spacing:var(--ls-display); line-height:var(--lh-heading); margin:0 0 16px; }
  .sheet-label{ font-size:var(--fs-xs); font-weight:var(--fw-bold); letter-spacing:.05em; text-transform:uppercase; color:var(--ink-soft); margin:14px 4px 8px; display:flex; align-items:center; gap:7px; }
  .sheet h3 + .sheet-label{ margin-top:6px; }
  .sheet-label .lbl-cap{ flex:1; }
  .sheet-label .lbl-hint{ font-size:var(--fs-xs); font-weight:var(--fw-medium); text-transform:none; letter-spacing:0; color:var(--ink-faint); }
  .frow{ display:flex; align-items:center; gap:12px; margin-bottom:14px; }
  .frow .fl{ flex:1; font-size:var(--fs-base); font-weight:var(--fw-medium); }
  .sheet input.txt{ flex:1; border:1px solid var(--line-strong); border-radius:var(--r-sm); background:var(--surface-2); padding:11px 13px; font-size:var(--fs-input); -webkit-user-select:text; user-select:text; }
  .sheet input.num{ width:min(116px, 34vw); text-align:right; border:1px solid var(--line-strong); border-radius:var(--r-sm); background:var(--surface-2); padding:11px 13px; font-size:var(--fs-input); font-weight:var(--fw-medium); -webkit-user-select:text; user-select:text; }
  .catscroll{ display:flex; gap:8px; overflow-x:auto; padding:2px 0 6px; margin:0 -18px 8px; padding-left:18px; padding-right:18px; }
  .catscroll::-webkit-scrollbar{ display:none; }
  .catchip{ flex:0 0 auto; display:flex; align-items:center; gap:6px; border:0; background:var(--surface-3); border-radius:var(--r-pill); padding:8px 13px; font-size:var(--fs-md); font-weight:var(--fw-medium); white-space:nowrap; }
  .catchip.on{ background:var(--brand); color:var(--on-brand); }
  .cadrow{ display:flex; gap:8px; flex-wrap:wrap; }
  .cadchip{ border:0; background:var(--surface-3); border-radius:var(--r-md); padding:9px 13px; font-size:var(--fs-md); font-weight:var(--fw-medium); }
  .cadchip.on{ background:var(--accent); color:var(--on-accent); }
  /* Actiebalk blijft onderin zichtbaar terwijl de sheet scrolt (negatieve marge/offset vangen de sheet-padding op) */
  .sheet-actions{ display:flex; gap:10px; position:sticky; bottom:calc(-1 * var(--sheet-pad-b, 0px)); z-index:2; margin:18px 0 calc(-1 * var(--sheet-pad-b, 0px)); padding:10px 0 var(--sheet-pad-b, 0px); background:var(--surface-1); }
  .sheet-actions::before{ content:""; position:absolute; left:0; right:0; top:-16px; height:16px; background:linear-gradient(to bottom, transparent, var(--surface-1)); pointer-events:none; }
  .sheet-actions .save{ flex:1; border:0; background:var(--brand); color:var(--on-brand); border-radius:var(--r-md); padding:15px; font-size:var(--fs-lg); font-weight:var(--fw-bold); }
  .sheet-actions .del{ flex:0 0 auto; border:0; background:var(--surface-3); color:var(--danger); border-radius:var(--r-md); padding:15px 18px; font-size:var(--fs-lg); font-weight:var(--fw-bold); }
  .intro-pt{ display:flex; gap:13px; align-items:flex-start; margin-bottom:15px; font-size:var(--fs-md); line-height:1.45; color:var(--ink-soft); }
  .intro-pt .ip-em{ font-size:var(--fs-2xl); flex:0 0 auto; line-height:1.2; }
  .intro-pt b{ color:var(--ink); font-weight:var(--fw-bold); }

  /* ---------- Toast ---------- */
  .toast{ position:absolute; left:50%; bottom:calc(var(--safe-b) + 92px); transform:translateX(-50%) translateY(16px); background:var(--ink); color:var(--bg); padding:11px 18px; border-radius:var(--r-md); font-size:var(--fs-md); font-weight:var(--fw-medium); opacity:0; z-index:95; pointer-events:none; box-shadow:var(--el-3); transition:opacity var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-out); max-width:min(var(--app-max-width), calc(100vw - 32px)); white-space:normal; text-align:center; line-height:1.35; }
  /* Alleen een ZICHTBARE toast vangt taps (pauze-op-aanraken); verborgen = pointer-events:none, ook met has-action */
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }
  /* In winkelmodus/stuur-pagina (full-screen overlays) staat de toast lager: geen add-balk om boven te blijven */
  .send-screen.show ~ .toast{ bottom:calc(var(--safe-b) + 24px); }
  /* Winkelmodus: toast onder de voortgangsbalk, nooit over de voetbalk met invoer/Afronden */
  .shop-screen.show ~ .toast{ bottom:auto; top:calc(var(--safe-t) + 74px); transform:translateX(-50%) translateY(-16px); }
  .shop-screen.show ~ .toast.show{ transform:translateX(-50%) translateY(0); }
  /* Geen invoerbalk op Vaste/Meer → toast laag, niet midden over de inhoud */
  body.tab-meer .toast, body.tab-vaste .toast{ bottom:calc(var(--safe-b) + 24px); }
  /* Sheet open: toast bovenin, anders ligt hij midden over de sheet-inhoud */
  body.sheet-open .toast{ bottom:auto; top:calc(var(--safe-t) + 14px); transform:translateX(-50%) translateY(-16px); }
  body.sheet-open .toast.show{ transform:translateX(-50%) translateY(0); }

  /* ---------- Cloud: list switch, members, share, send ---------- */
  .list-switch{ display:inline-flex; align-items:center; gap:7px; margin-top:8px; background:var(--surface-3); border:0; border-radius:var(--r-pill); padding:6px 12px 6px 13px; box-shadow:none; font-size:var(--fs-md); font-weight:var(--fw-medium); max-width:100%; }
  .list-switch .ls-ico{ font-size:var(--fs-md); }
  .list-switch .ls-ico-dot{ width:11px; height:11px; border-radius:50%; flex:0 0 auto; }
  .list-switch .ls-name{ white-space:normal; overflow-wrap:anywhere; text-align:left; line-height:1.2; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }   /* nooit afkorten: op smalle schermen twee regels */
  .list-switch .ls-pill-sub{ font-size:var(--fs-xs); font-weight:var(--fw-bold); color:var(--ink-faint); flex:0 0 auto; padding:1px 7px; background:var(--surface-3); border-radius:var(--r-pill); }
  .list-switch .ls-chev{ width:16px; height:16px; color:var(--ink-faint); flex:0 0 auto; }
  .members-row{ display:flex; align-items:center; gap:8px; margin:6px 4px 6px; min-height:0; }
  .members-row.empty{ display:none; }
  .avatars{ display:flex; gap:4px; cursor:pointer; }
  .avatars .av{ width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:var(--fs-xs); font-weight:var(--fw-medium); color:#fff; letter-spacing:.02em; }
  .members-row .share-btn{ margin-left:auto; display:inline-flex; align-items:center; gap:6px; background:var(--surface-3); color:var(--ink-soft); border:0; border-radius:var(--r-pill); padding:5px 11px; font-size:var(--fs-xs); font-weight:var(--fw-medium); }
  .members-row .share-btn svg{ width:13px; height:13px; }
  .members-row .share-btn:active{ background:var(--surface-2); }

  .ls-item{ display:flex; align-items:center; gap:12px; padding:13px 4px; border-bottom:1px solid var(--line); }
  .ls-item:last-child{ border-bottom:0; }
  .ls-item .lsi-ico{ width:40px; height:40px; border-radius:var(--r-md); background:var(--brand-2); display:flex; align-items:center; justify-content:center; font-size:var(--fs-xl); flex:0 0 auto; }
  .ls-item .lsi-name{ flex:1; font-size:var(--fs-lg); font-weight:var(--fw-medium); min-width:0; white-space:normal; overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .ls-item .lsi-sub{ font-size:var(--fs-sm); color:var(--ink-soft); }
  .ls-item .lsi-more{ flex:0 0 auto; width:var(--tap-size-sm); height:var(--tap-size-sm); border:0; border-radius:var(--r-sm); background:var(--surface-3); color:var(--ink-soft); font-size:var(--fs-lg); }
  /* nieuwe lijst: soort-keuze */
  .type-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:8px; margin:0 0 12px; }
  .type-chip{ border:0; background:var(--surface-2); border-radius:var(--r-md); padding:12px 12px 10px; text-align:left; box-shadow:var(--el-1); color:var(--ink); }
  .type-chip.on{ background:var(--brand-2); box-shadow:inset 0 0 0 2px var(--brand); }
  .type-chip .tc-g{ font-size:var(--fs-xl); line-height:1; }
  .type-chip .tc-n{ display:block; font-weight:var(--fw-bold); margin-top:6px; font-size:var(--fs-md); }
  .type-chip .tc-s{ display:block; font-size:var(--fs-xs); color:var(--ink-soft); margin-top:2px; line-height:1.35; }
  /* plain lijsten: geen schappen-segment, geen scanner, meerregelige tekst, sleepgreep */
  body.list-plain .view-seg, body.list-plain .field-scan{ display:none; }
  body.list-plain .nm{ -webkit-line-clamp:3; }
  .card .sr-handle{ flex:0 0 auto; width:36px; height:36px; margin:-4px -8px -4px 0; display:flex; align-items:center; justify-content:center; color:var(--ink-decorative); touch-action:none; cursor:grab; border-radius:var(--r-sm); }
  .card .sr-handle svg{ width:18px; height:18px; }
  .row.dragging{ z-index:5; box-shadow:var(--el-3); opacity:.95; }
  .row.dragging .card{ background:var(--surface-2); }
  .finish-inline{ display:flex; gap:8px; flex-wrap:wrap; }
  .finish-inline-btn.soft{ background:var(--surface-3); color:var(--ink); box-shadow:none; }
  /* Prestaties: rijen ver buiten beeld niet layouten */
  #open-list .row{ content-visibility:auto; contain-intrinsic-size:auto 64px; }
  /* Uitgaven-inzicht */
  .spend-wrap{ padding:6px 16px 14px; }
  .spend{ display:flex; align-items:flex-end; gap:6px; height:84px; padding-top:16px; }
  .spend .bar{ flex:1; position:relative; background:var(--brand-2); border-radius:var(--r-xs) var(--r-xs) 0 0; min-height:3px; }
  .spend .bar.now{ background:var(--brand); }
  .spend .bar span{ position:absolute; left:50%; bottom:100%; transform:translateX(-50%); font-size:var(--fs-xs); color:var(--ink-faint); white-space:nowrap; padding-bottom:2px; }
  .spend-lbls{ display:flex; gap:6px; margin-top:4px; font-size:var(--fs-xs); color:var(--ink-faint); }
  .spend-lbls span{ flex:1; text-align:center; }
  /* Meer contrast / geforceerde kleuren */
  @media (prefers-contrast: more){
    :root, html[data-theme="dark"]{ --line:var(--line-strong); --ink-faint:var(--ink-soft); --ink-decorative:var(--ink-faint); }
    .row{ box-shadow:none; border:1px solid var(--line-strong); }
  }
  @media (forced-colors: active){
    .row, .card, .check, .shop-check, .switch, .chip, .mbtn, .toast, .sheet{ border:1px solid CanvasText; }
    .row.done .check, .shop-row.done .shop-check, .switch.on{ background:Highlight; }
    :focus-visible{ outline:2px solid Highlight; }
  }
  /* Afdrukken: alleen de lijst */
  @media print{
    .topbar, .addwrap, .totals, .toast, .scrim, .sheet, .shop-screen, .view-seg, #store-pick, #week-ritual, #due-banner, #shop-entry, .search-bar, .row-actions, .sr-handle, .qty button, .offline-badge, #list-switch-wrap, .members-row, .shortcuts-row{ display:none !important; }
    html, body{ overflow:visible !important; height:auto !important; background:#fff !important; color:#000 !important; }
    .app{ box-shadow:none !important; height:auto !important; overflow:visible !important; margin:0 !important; }
    #main{ position:static !important; overflow:visible !important; }
    .row, .card{ box-shadow:none !important; border:1px solid #999; break-inside:avoid; }
    .largehead{ padding-top:0 !important; }
  }
  .ls-item.active .lsi-name{ color:var(--brand); }
  .ls-item .lsi-check{ color:var(--brand); }
  .quick-create{ margin:14px 0 0; padding:0; }
  .quick-create input{ width:100%; border:1.5px dashed var(--line-strong); border-radius:var(--r-sm); background:var(--surface-2); padding:14px 16px; font-size:var(--fs-input); font-weight:var(--fw-medium); color:var(--ink); -webkit-user-select:text; user-select:text; }
  .quick-create input:focus{ outline:0; border-color:var(--brand); border-style:solid; background:var(--surface-1); }
  .quick-create input::placeholder{ color:var(--ink-faint); font-weight:var(--fw-medium); }

  .code-box{ text-align:center; background:var(--surface-2); border:1px dashed var(--line-strong); border-radius:var(--r-lg); padding:18px; margin:4px 0 14px; }
  .code-box .cb-lbl{ font-size:var(--fs-xs); font-weight:var(--fw-bold); text-transform:uppercase; letter-spacing:.1em; color:var(--ink-soft); }
  .code-box .cb-code{ font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:var(--fs-2xl); font-weight:var(--fw-bold); letter-spacing:.14em; margin-top:4px; white-space:nowrap; overflow-wrap:anywhere; overflow:hidden; text-overflow:ellipsis; }

  /* ---------- "Stuur naar"-snelkoppelingen ---------- */
  .shortcuts-row{ margin:-2px -16px 10px; padding:0; }
  .shortcuts-row.empty{ display:none; }
  .shortcuts-row .sc-scroll{ display:flex; gap:8px; overflow-x:auto; padding:4px 16px; scroll-snap-type:x proximity; -webkit-overflow-scrolling:touch; }
  .shortcuts-row .sc-scroll::-webkit-scrollbar{ display:none; }
  .sc-chip{ flex:0 0 auto; display:inline-flex; align-items:center; gap:7px; background:var(--surface-3); border:0; border-radius:var(--r-pill); padding:7px 13px 7px 9px; font-size:var(--fs-md); font-weight:var(--fw-medium); color:var(--ink); box-shadow:none; scroll-snap-align:start; transition:transform var(--dur-instant) var(--ease-out); }
  .sc-chip:active{ transform:var(--press); }
  .sc-dot{ display:inline-block; width:9px; height:9px; border-radius:50%; flex:0 0 auto; }
  .sc-arrow{ color:var(--ink-faint); font-weight:var(--fw-medium); font-size:var(--fs-sm); margin-right:-2px; }
  .sc-name{ white-space:nowrap; max-width:130px; overflow:hidden; text-overflow:ellipsis; }
  .sc-action{ padding:7px 13px; color:var(--brand); border:1px dashed var(--line-strong); background:transparent; justify-content:center; font-size:var(--fs-md); font-weight:var(--fw-bold); gap:0; }

  .friend-me{ display:flex; align-items:center; gap:13px; padding:14px; background:var(--surface-1); border:0; border-radius:var(--r-lg); box-shadow:var(--el-1); margin-bottom:14px; }
  .friend-me .fm-name{ font-size:var(--fs-lg); font-weight:var(--fw-bold); }
  .friend-me .fm-sub{ font-size:var(--fs-xs); color:var(--ink-soft); margin-top:3px; }

  /* ---------- Share-actions sheet (sa-) ---------- */
  .sa-row{ display:flex; align-items:center; gap:14px; width:100%; background:var(--surface-1); border:0; border-radius:var(--r-lg); padding:14px; box-shadow:var(--el-1); margin-bottom:10px; text-align:left; }
