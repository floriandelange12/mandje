  .sa-meta{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
  .sa-ttl{ font-size:var(--fs-base); font-weight:var(--fw-medium); color:var(--ink); }
  .sa-sub{ font-size:var(--fs-sm); font-weight:var(--fw-medium); color:var(--ink-soft); line-height:1.35; }
  .sa-chev{ flex:0 0 auto; color:var(--ink-faint); font-size:var(--fs-xl); font-weight:var(--fw-regular); margin-left:4px; }

  .send-screen{ position:absolute; inset:0; z-index:80; background:var(--bg); display:none; flex-direction:column; padding:calc(var(--safe-t) + 24px) max(20px,env(safe-area-inset-left)) calc(var(--safe-b) + 24px) max(20px,env(safe-area-inset-right)); overflow-y:auto; }
  .send-screen.show{ display:flex; }
  .send-screen .ss-badge{ width:64px; height:64px; border-radius:var(--r-lg); background:var(--brand-2); display:flex; align-items:center; justify-content:center; margin-bottom:18px; }
  .send-screen .ss-badge svg{ width:30px; height:30px; color:var(--brand); }
  .send-screen h1{ margin:0 0 4px; }
  .send-screen .ss-sub{ color:var(--ink-soft); margin-bottom:22px; }
  /* Klein label boven de titel (stuur-pagina) — ontbrak eerder als CSS-class */
  .eyebrow{ font-size:var(--fs-xs); font-weight:var(--fw-bold); letter-spacing:.08em; text-transform:uppercase; color:var(--brand); margin-bottom:6px; }

  /* Lege-staat bij zoeken zonder resultaat (Lijst-tab) */
  .search-empty{ display:flex; flex-direction:column; align-items:center; text-align:center; padding:38px 20px 14px; color:var(--ink-soft); font-size:var(--fs-md); line-height:1.5; }
  .search-empty .se-ico{ width:52px; height:52px; border-radius:50%; background:var(--surface-3); display:flex; align-items:center; justify-content:center; margin-bottom:12px; color:var(--ink-faint); }
  .search-empty .se-ico svg{ width:24px; height:24px; }
  .search-empty .se-txt{ max-width:240px; }
  .send-screen .ss-added{ margin-top:18px; }
  .send-screen .ss-added .chip{ margin:0 8px 8px 0; }
  /* Barcode-scanner camera-container (html5-qrcode rendert hierin) */
  #bc-reader{ width:100%; max-width:360px; aspect-ratio:3/4; margin:6px auto 0; border-radius:var(--r-lg); overflow:hidden; background:#000; position:relative; }
  #bc-reader video{ width:100%!important; height:100%!important; object-fit:cover; display:block; }
  .bc-zoom{ position:absolute; right:10px; bottom:10px; z-index:2; border:0; border-radius:var(--r-pill); padding:0 14px; min-height:var(--tap-size-sm); background:rgba(0,0,0,.55); color:#fff; font-weight:var(--fw-bold); font-size:var(--fs-sm); font-variant-numeric:tabular-nums; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  .bc-status{ text-align:center; color:var(--ink-soft); font-size:var(--fs-md); margin:14px 0 2px; min-height:18px; }
  /* barcode: bevestigingschip */
  .bc-hit{ display:none; margin:10px auto 0; max-width:360px; background:var(--surface-1); border-radius:var(--r-lg); box-shadow:var(--el-2); padding:12px 14px; text-align:left; }
  .bc-hit.show{ display:block; animation:rowSlideIn var(--dur-base) var(--ease-out); }
  .bc-hit-main{ display:flex; align-items:center; gap:12px; }
  .bc-hit-txt{ flex:1; min-width:0; }
  .bc-hit-name{ font-weight:var(--fw-bold); font-size:var(--fs-base); white-space:normal; overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .bc-hit-sub{ font-size:var(--fs-sm); color:var(--ink-soft); white-space:normal; overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .bc-hit-acts{ display:flex; gap:8px; margin-top:10px; }
  .bc-hit-add{ flex:1; border:0; background:var(--brand); color:var(--on-brand); font-weight:var(--fw-bold); border-radius:var(--r-md); padding:12px; font-size:var(--fs-md); min-height:var(--tap-size-sm); }
  .bc-hit-more{ flex:0 0 auto; border:0; background:var(--surface-3); color:var(--ink); border-radius:var(--r-md); padding:12px 14px; font-size:var(--fs-md); min-height:var(--tap-size-sm); }
  /* toewijzen: filterchips + avatar-badge op de rij */
  .assign-filter{ display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 4px; }
  .assign-filter.empty{ display:none; }
  .assign-filter .chip{ padding:6px 11px; font-size:var(--fs-sm); }
  .assign-filter .chip.on{ background:var(--brand); color:var(--on-brand); }
  .assign-filter .chip.on .plus{ color:var(--on-brand); }
  .asg-av{ flex:0 0 auto; width:24px; height:24px; border-radius:50%; color:#fff; font-size:var(--fs-xs); font-weight:var(--fw-bold); display:inline-flex; align-items:center; justify-content:center; }
  .asg-av.mini{ width:18px; height:18px; font-size:calc(var(--fs-xs) * .85); }
  /* Aan de slag */
  .ritual.onboard{ background:var(--surface-1); box-shadow:var(--el-1); }
  .ritual.cache-bar{ background:var(--accent-2); padding-right:16px; }
  .ritual.cache-bar h4{ color:var(--accent); }
  .ritual.onboard h4{ color:var(--ink); }
  .ob-steps{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:4px; }
  .ob-btn{ display:flex; align-items:center; gap:10px; width:100%; border:0; background:transparent; padding:8px 4px; text-align:left; font-size:var(--fs-md); color:var(--ink); border-radius:var(--r-sm); min-height:var(--tap-size-sm); }
  .ob-btn:disabled{ color:var(--ink-faint); }
  .ob-step.done .ob-lbl{ text-decoration:line-through; }
  .ob-check{ flex:0 0 auto; width:22px; height:22px; border-radius:50%; border:2px solid var(--line-control); display:inline-flex; align-items:center; justify-content:center; font-size:var(--fs-xs); font-weight:var(--fw-bold); color:var(--on-brand); }
  .ob-step.done .ob-check{ background:var(--brand); border-color:var(--brand); }
  .intro-chips{ justify-content:center; margin-top:12px; }
  .intro-chips .chip.on{ background:var(--brand-2); color:var(--brand); }
  /* QR in de deel-sheet */
  .qr-box{ text-align:center; margin:4px 0 12px; }
  .qr-box .qr-svg svg{ width:min(220px, 60vw); height:auto; border-radius:var(--r-md); box-shadow:var(--el-1); }
  .qr-box .qr-cap{ font-size:var(--fs-sm); color:var(--ink-soft); margin-top:8px; }

  /* ---------- Winkelmodus (in-store focus) ---------- */
  #shop-entry:empty{ display:none; }
  .shop-enter-btn{ display:flex; align-items:center; justify-content:center; gap:10px; width:100%; background:var(--brand); color:var(--on-brand); border:0; border-radius:var(--r-lg); padding:14px; font-size:var(--fs-base); font-weight:var(--fw-bold); box-shadow:var(--el-1); margin:2px 0 14px; transition:transform var(--dur-instant) var(--ease-out), filter var(--dur-instant) var(--ease-inout); }
  .shop-enter-btn:active{ transform:var(--press); filter:brightness(.95); }
  .shop-enter-btn svg{ width:20px; height:20px; }
  .shop-enter-btn .shop-enter-count{ background:rgba(255,255,255,.22); padding:1px 9px; border-radius:var(--r-pill); font-size:var(--fs-md); font-variant-numeric:tabular-nums; }

  .shop-screen{ position:absolute; inset:0; z-index:80; background:var(--bg); display:none; flex-direction:column; padding:calc(var(--safe-t) + 12px) max(16px,env(safe-area-inset-left)) calc(var(--safe-b) + 12px) max(16px,env(safe-area-inset-right)); }
  .shop-screen.show{ display:flex; animation:viewSlideIn var(--dur-base) var(--ease-out); }
  .shop-head{ display:flex; align-items:center; gap:12px; margin-bottom:10px; }
  .shop-head .shop-close{ flex:0 0 auto; width:40px; height:40px; border:0; background:var(--surface-3); color:var(--ink); border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .shop-head .shop-close svg{ width:20px; height:20px; }
  .shop-head .shop-title{ flex:1; font-family:var(--display); font-size:var(--fs-2xl); font-weight:var(--fw-medium); letter-spacing:var(--ls-display); }
  .shop-head .shop-count{ flex:0 0 auto; font-size:var(--fs-md); font-weight:var(--fw-bold); color:var(--ink-soft); font-variant-numeric:tabular-nums; }
  .shop-pbar{ height:6px; border-radius:var(--r-pill); background:var(--surface-3); overflow:hidden; margin:0 0 12px; }
  .shop-pbar > i{ display:block; height:100%; background:var(--brand); border-radius:var(--r-pill); transition:width var(--dur-slow) var(--ease-out); }
  .shop-body{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .shop-body::-webkit-scrollbar{ display:none; }
  .shop-sec{ font-size:var(--fs-sm); font-weight:var(--fw-medium); letter-spacing:.04em; text-transform:uppercase; color:var(--ink-soft); margin:16px 4px 8px; display:flex; align-items:center; gap:8px; }
  .shop-sec .emoji{ font-size:var(--fs-md); }
  .shop-sec.done-sec{ color:var(--brand); }
  .shop-row{ display:flex; align-items:center; gap:14px; width:100%; text-align:left; background:var(--surface-1); border:0; border-radius:var(--r-lg); padding:16px; margin-bottom:8px; box-shadow:var(--el-1); min-height:56px; transition:transform var(--dur-instant) var(--ease-out), background-color var(--dur-fast) var(--ease-inout), box-shadow var(--dur-fast) var(--ease-inout); }
  .shop-row:active{ transform:scale(.99); background:var(--surface-3); }
  .shop-row .shop-check{ flex:0 0 auto; width:32px; height:32px; border-radius:50%; border:2px solid var(--line-control); display:flex; align-items:center; justify-content:center; }
  .shop-row .shop-check svg{ width:18px; height:18px; opacity:0; }
  .shop-row.done{ background:var(--surface-2); box-shadow:var(--el-0); }
  .shop-row.done .shop-check{ background:var(--brand); border-color:var(--brand); }
  .shop-row.done .shop-check svg{ opacity:1; }
  .shop-row .shop-name{ flex:1; min-width:0; font-size:var(--fs-lg); font-weight:var(--fw-medium); letter-spacing:-.01em; white-space:normal; overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; text-decoration:line-through; text-decoration-color:transparent; text-decoration-thickness:1.5px; transition:text-decoration-color var(--dur-base) var(--ease-out); }
  .shop-row.done .shop-name{ color:var(--ink-faint); }
  .shop-row .shop-qty{ flex:0 0 auto; font-size:var(--fs-md); font-weight:var(--fw-medium); color:var(--ink-soft); background:var(--surface-3); border-radius:var(--r-sm); padding:3px 10px; min-width:30px; text-align:center; font-variant-numeric:tabular-nums; }
  .shop-finish{ width:100%; border:0; background:var(--brand); color:var(--on-brand); font-weight:var(--fw-bold); font-size:var(--fs-lg); padding:16px; border-radius:var(--r-lg); box-shadow:var(--el-1); margin:18px 0 8px; }
  .shop-finish:active{ filter:brightness(.94); }
  .shop-empty{ text-align:center; color:var(--ink-soft); padding:48px 20px; }
  .shop-row.done{ opacity:.62; }
  .shop-row.done .shop-name{ text-decoration-color:currentColor; }
  .shop-row.flash{ animation:rowFlash 1.2s var(--ease-out); }
  .shop-screen.hide-done .shop-row.done{ display:none; }
  .shop-screen.hide-done .shelf.all-done{ display:none; }
  .shop-sec .shop-sec-ok{ display:none; margin-left:auto; color:var(--brand); font-weight:var(--fw-bold); }
  .shelf.all-done .shop-sec{ color:var(--brand); }
  .shelf.all-done .shop-sec .shop-sec-ok{ display:inline; }
  .shelf.celebrate .shop-sec{ animation:secPop var(--dur-celebrate) var(--ease-spring); }
  @keyframes secPop{ 0%{ transform:scale(1); } 35%{ transform:scale(1.06); } 100%{ transform:scale(1); } }
  .shop-alldone{ text-align:center; padding:28px 20px 12px; color:var(--ink-soft); }
  .shop-alldone .sa-ico{ width:96px; margin:0 auto 6px; color:var(--brand); }
  .shop-alldone .sa-ico svg{ width:100%; height:auto; }
  .shop-alldone .sa-ico .hero-accent{ stroke:var(--accent); }
  .shop-alldone h3{ font-family:var(--display); font-size:var(--fs-xl); font-weight:var(--fw-medium); margin:0 0 4px; color:var(--ink); }
  .shop-alldone p{ margin:0; font-size:var(--fs-md); }
  .shop-foot{ flex:0 0 auto; display:flex; flex-direction:column; gap:10px; padding-top:10px; border-top:1px solid var(--line); margin-top:6px; }
  body.kb-open .shop-foot{ padding-bottom:var(--kb-lift, 0px); }
  .shop-add{ display:flex; align-items:center; gap:8px; background:var(--surface-1); border-radius:var(--r-lg); padding:5px 5px 5px 14px; box-shadow:var(--el-1); }
  .shop-add input{ flex:1; min-width:0; border:0; outline:0; background:transparent; font-size:var(--fs-input); padding:8px 0; -webkit-user-select:text; user-select:text; }
  .shop-add .shop-add-btn{ flex:0 0 auto; width:var(--tap-size-sm); height:var(--tap-size-sm); border:0; border-radius:var(--r-md); background:var(--brand); color:var(--on-brand); font-size:var(--fs-xl); font-weight:var(--fw-bold); line-height:1; }
  .shop-foot-row{ display:flex; align-items:center; gap:10px; }
  .shop-hide{ flex:0 0 auto; border:0; background:var(--surface-3); color:var(--ink-soft); border-radius:var(--r-pill); padding:9px 14px; font-size:var(--fs-sm); font-weight:var(--fw-medium); min-height:var(--tap-size-sm); }
  .shop-hide[aria-pressed="true"]{ background:var(--brand-2); color:var(--brand); }
  .shop-foot-row .shop-finish{ flex:1; margin:0; }
  .shop-finish:disabled{ opacity:.5; }

  /* ---------- Uniforme emoji-rendering ---------- */
  .emoji{ font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif; font-style:normal; font-weight:400; line-height:1; vertical-align:-1px; }

  /* ---------- Search-bar (Lijst-tab) ---------- */
  .search-bar{ position:relative; margin:6px 0 12px; display:flex; align-items:center; background:var(--surface-3); border:0; border-radius:var(--r-md); padding:9px 13px; box-shadow:none; max-height:52px; opacity:1; overflow:hidden; transition:max-height var(--dur-base) var(--ease-out), opacity var(--dur-base) var(--ease-out), margin var(--dur-base) var(--ease-out); }
  .search-bar.collapsed{ max-height:0; opacity:0; margin-top:0; margin-bottom:0; padding-top:0; padding-bottom:0; pointer-events:none; }
  .search-bar svg.lead{ width:16px; height:16px; color:var(--ink-faint); flex:0 0 16px; margin-right:9px; }
  .search-bar input{ flex:1; border:0; outline:0; background:transparent; font-size:var(--fs-input); padding:2px 0; -webkit-user-select:text; user-select:text; }
  .search-bar .search-clear{ flex:0 0 auto; width:22px; height:22px; border:0; padding:0; background:var(--surface-3); color:var(--ink-soft); border-radius:50%; display:flex; align-items:center; justify-content:center; margin-left:6px; font-size:var(--fs-sm); line-height:1; }
  .search-bar.empty .search-clear{ display:none; }

  /* ---------- Pull-to-refresh indicator ---------- */
  .ptr{ position:absolute; left:50%; top:calc(var(--safe-t) + 38px); transform:translate(-50%, -28px); width:36px; height:36px; border-radius:50%; background:var(--surface-1); border:0; box-shadow:var(--el-3); display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; z-index:35; transition:transform var(--dur-base) var(--ease-out), opacity var(--dur-base) var(--ease-inout); }
  .ptr.show{ opacity:1; transform:translate(-50%, var(--ptr-y, 8px)); }
  .ptr svg{ width:18px; height:18px; color:var(--brand); }
  .ptr.spin svg{ animation:ptr-spin 1s linear infinite; }
  @keyframes ptr-spin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }

  /* ---------- Sortable list (Meer-tab: schap-volgorde) ---------- */
  .sort-list{ display:flex; flex-direction:column; gap:6px; }
  /* Rij mag normaal verticaal scrollen; alleen het handvat vangt de sleep-gesture */
  .sort-row{ display:flex; align-items:center; gap:12px; padding:11px 14px; background:var(--surface-1); border:0; border-radius:var(--r-md); box-shadow:var(--el-1); touch-action:pan-y; user-select:none; -webkit-user-select:none; transition:transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-inout); }
  .sort-row.dragging{ transform:scale(1.02); box-shadow:var(--el-3); z-index:5; opacity:.95; }
  .sort-row .sr-emoji{ font-size:var(--fs-xl); width:30px; text-align:center; flex:0 0 auto; }
  .sort-row .sr-label{ flex:1; font-size:var(--fs-base); font-weight:var(--fw-medium); }
  .sort-row .sr-handle{ flex:0 0 auto; color:var(--ink-faint); width:40px; height:40px; margin:-8px -6px -8px 0; display:flex; align-items:center; justify-content:center; cursor:grab; touch-action:none; }
  .sort-row .sr-handle svg{ width:18px; height:18px; }
  .sort-row .sr-del{ flex:0 0 auto; border:0; background:transparent; color:var(--ink-faint); padding:4px 6px; font-size:var(--fs-sm); font-weight:var(--fw-medium); }
  .sort-row .sr-del:active{ color:var(--danger); }

  /* ---------- Emoji-picker (compact) ---------- */
  .emoji-picker{ display:grid; grid-template-columns:repeat(8, 1fr); gap:6px; margin:4px 0 8px; }
  .emoji-picker .ep-cell{ aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:var(--fs-xl); border:0; background:var(--surface-3); border-radius:var(--r-sm); padding:0; transition:transform var(--dur-instant) var(--ease-out), background var(--dur-fast) var(--ease-inout); }
  .emoji-picker .ep-cell:active{ transform:var(--press); background:var(--surface-3); }
  .emoji-picker .ep-cell.on{ background:var(--brand-2); color:var(--brand); }

  /* ---------- Recente activiteit (in share-sheet) ---------- */
  .activity-row{ display:flex; align-items:center; gap:10px; padding:8px 4px; font-size:var(--fs-md); }
  .activity-row .ar-icon{ flex:0 0 auto; width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:var(--fs-sm); color:var(--on-brand); font-weight:var(--fw-bold); }
  .activity-row .ar-icon.add{ background:var(--brand); }
  .activity-row .ar-icon.done{ background:var(--accent); color:var(--on-accent); }
  .activity-row .ar-text{ flex:1; min-width:0; white-space:normal; overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; color:var(--ink); }
  .activity-row .ar-text b{ font-weight:var(--fw-medium); }
  .activity-row .ar-time{ flex:0 0 auto; font-size:var(--fs-xs); color:var(--ink-faint); }

  /* ---------- Intro stappen (onboarding) ---------- */
  .intro-stage{ display:flex; flex-direction:column; align-items:center; padding:10px 4px 4px; min-height:280px; }
  .intro-card{ width:100%; max-width:340px; padding:28px 22px; background:var(--surface-1); border:0; border-radius:var(--r-xl); text-align:center; box-shadow:var(--el-1); margin-bottom:18px; }
  .intro-card .ic-glyph{ font-size:calc(var(--fs-3xl) * 1.4); margin-bottom:14px; line-height:1; }
  .intro-card h4{ font-family:var(--display); font-size:var(--fs-xl); font-weight:var(--fw-medium); letter-spacing:var(--ls-display); margin:0 0 8px; }
  .intro-card p{ font-size:var(--fs-md); line-height:1.45; color:var(--ink-soft); margin:0; }
  .intro-dots{ display:flex; gap:8px; margin:6px 0 18px; }
  .intro-dots .id-dot{ width:8px; height:8px; border-radius:50%; background:var(--surface-3); transition:background var(--dur-base) var(--ease-inout), width var(--dur-base) var(--ease-out); }
  .intro-dots .id-dot.on{ background:var(--brand); width:22px; border-radius:var(--r-pill); }
  /* Interactieve eerste stap: live demo van auto-categorisering */
  .intro-card-demo{ padding:24px 18px; }
  .intro-card-demo h4{ margin-bottom:6px; }
  .intro-card-demo p{ margin-bottom:16px; }
  .intro-demo{ width:100%; }
  .intro-demo .idemo-field{ display:flex; align-items:center; gap:9px; background:var(--surface-1); border:1.5px solid var(--brand); border-radius:var(--r-md); padding:11px 13px; box-shadow:var(--el-1); text-align:left; }
  .intro-demo .idemo-field .emoji{ font-size:var(--fs-lg); opacity:.7; }
  .intro-demo .idemo-field input{ flex:1; min-width:0; border:0; outline:0; background:transparent; font-size:var(--fs-input); -webkit-user-select:text; user-select:text; }
  .intro-demo .idemo-tries{ display:flex; flex-wrap:wrap; gap:7px; justify-content:center; margin:13px 0 2px; }
  .intro-demo .idemo-try{ border:0; background:var(--surface-3); color:var(--ink-soft); border-radius:var(--r-pill); padding:6px 13px; font-size:var(--fs-sm); font-weight:var(--fw-medium); }
  .intro-demo .idemo-try:active{ background:var(--surface-3); }
  .intro-demo .idemo-result{ display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; margin-top:16px; min-height:42px; opacity:0; transform:translateY(8px); transition:opacity var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-out); }
  .intro-demo .idemo-result.show{ opacity:1; transform:none; }
  .intro-demo .idemo-chip{ display:inline-flex; align-items:center; gap:8px; background:var(--brand-2); color:var(--ink); border-radius:var(--r-md); padding:8px 12px; font-weight:var(--fw-medium); font-size:var(--fs-md); }
  .intro-demo .idemo-arrow{ color:var(--ink-faint); font-weight:var(--fw-medium); }
  .intro-demo .idemo-shelf{ display:inline-flex; align-items:center; background:var(--surface-3); color:var(--ink-soft); border-radius:var(--r-md); padding:8px 12px; font-weight:var(--fw-medium); font-size:var(--fs-md); }
  .intro-demo .idemo-hint{ text-align:center; color:var(--ink-faint); font-size:var(--fs-sm); margin-top:13px; min-height:18px; }

  /* ---------- Inline rename (share-sheet) ---------- */
  .inline-rename{ display:flex; align-items:center; gap:10px; width:100%; }
  .inline-rename input{ flex:1; min-width:0; border:1px solid var(--line-strong); border-radius:var(--r-sm); background:var(--surface-2); padding:11px 13px; font-size:var(--fs-input); font-family:var(--display); font-weight:var(--fw-medium); letter-spacing:-.01em; -webkit-user-select:text; user-select:text; }
  .inline-rename .ir-save{ flex:0 0 auto; border:0; background:var(--brand); color:var(--on-brand); padding:10px 14px; border-radius:var(--r-md); font-size:var(--fs-md); font-weight:var(--fw-bold); }
  .inline-rename .ir-cancel{ flex:0 0 auto; border:0; background:transparent; color:var(--ink-soft); padding:10px 4px; font-size:var(--fs-md); font-weight:var(--fw-medium); }

  /* ---------- Member-rij in share-sheet kick/leave-knop ---------- */
  .ls-item .lsi-member-action{ flex:0 0 auto; border:0; background:transparent; color:var(--ink-soft); padding:9px 12px; min-height:38px; font-size:var(--fs-md); font-weight:var(--fw-medium); border-radius:var(--r-sm); }
  .ls-item .lsi-member-action.kick:active{ color:var(--danger); background:color-mix(in srgb, var(--danger) 8%, transparent); }
  .ls-item .lsi-member-action.leave:active{ color:var(--danger); background:color-mix(in srgb, var(--danger) 8%, transparent); }
  .ls-item .lsi-member-action.friend-send{ background:var(--brand-2); color:var(--brand); font-weight:var(--fw-medium); padding:9px 16px; }
  .ls-item .lsi-member-action.friend-send:active{ filter:brightness(.96); }

  /* ---------- Section overflow-link ---------- */
  .section .more-link{ background:none; border:0; padding:2px 4px; font-size:var(--fs-sm); font-weight:var(--fw-medium); color:var(--brand); text-transform:none; letter-spacing:0; }
  .section .more-link:active{ opacity:.7; }

  /* ---------- Section collapse (de kop is een echte <button>) ---------- */
  button.section{ width:100%; background:none; border:0; padding:0; text-align:left; cursor:pointer; min-height:0; color:var(--ink-soft); }
  .section.collapsible{ cursor:pointer; user-select:none; -webkit-user-select:none; }
  .section.collapsible .count{ margin-left:auto; }
  .section.collapsible .sec-chevron{ width:14px; height:14px; color:var(--ink-faint); transition:transform var(--dur-base) var(--ease-out); flex:0 0 auto; margin-left:8px; }
  .section.collapsible.collapsed .sec-chevron{ transform:rotate(-90deg); }
  ul.list.collapsed{ display:none; }

  /* ---------- Slide-in voor nieuwe items ---------- */
  @keyframes rowSlideIn{
    from{ opacity:0; transform:translateY(-10px) scale(.97); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }
  .row.entering{ animation:rowSlideIn var(--dur-slow) var(--ease-out) backwards; }

  /* ---------- Crisper checkmark (path-drawing animation) ---------- */
  .check svg path{ stroke-dasharray:24; stroke-dashoffset:24; }
  .row.done .check svg{ opacity:1; transform:scale(1); }
  .row.done .check svg path{ animation:drawCheck var(--dur-slow) var(--ease-out) forwards; }
  @keyframes drawCheck{ from{ stroke-dashoffset:24; } to{ stroke-dashoffset:0; } }

  /* ---------- Rich undo-toast ---------- */
  .toast{ display:inline-flex; align-items:center; gap:0; width:max-content; max-width:min(calc(100% - 32px), 520px); white-space:normal; text-align:left; line-height:1.35; }
  .toast .toast-action{ flex:0 0 auto; white-space:nowrap; }
  .toast .toast-msg{ flex:1; }
  .toast .toast-action{ background:transparent; border:0; color:color-mix(in srgb, var(--brand) 80%, var(--bg)); font-weight:var(--fw-bold); padding:6px 12px; margin-left:10px; border-radius:var(--r-sm); font-size:var(--fs-md); letter-spacing:.01em; }
  .toast.has-action{ padding:9px 8px 9px 18px; }
  .toast.has-tap{ cursor:pointer; }
  .sr-live{ position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
  .sr-handle{ border:0; background:transparent; padding:0; color:inherit; font:inherit; }
  /* naam/meta als knop (opent het sheet) — geen role=button op de hele kaart */
  button.meta{ display:block; flex:1; min-width:0; text-align:left; background:transparent; border:0; padding:0; margin:0; color:inherit; font:inherit; border-radius:var(--r-xs); }
  button.meta:focus-visible{ outline:2px solid var(--focus); outline-offset:3px; }
  /* tweede slot: boven de actie-toast (bij top-positie: eronder) */
  .toast-2{ margin-bottom:56px; z-index:96; }
  body.sheet-open .toast-2, .shop-screen.show ~ .toast-2{ margin-bottom:0; margin-top:56px; }
  /* Klaar!-blad */
  .fin-sum{ font-size:var(--fs-lg); color:var(--ink-soft); margin:2px 0 16px; }
  .fin-sum b{ color:var(--ink); font-weight:var(--fw-bold); }
  .fin-paid{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0 0 16px; font-size:var(--fs-md); }
  .fin-paid-in{ display:inline-flex; align-items:center; gap:4px; background:var(--surface-2); border:1px solid var(--line-strong); border-radius:var(--r-sm); padding:6px 10px; color:var(--ink-soft); }
  .fin-paid-in input{ width:7ch; border:0; background:transparent; font-size:var(--fs-input); color:var(--ink); outline:0; text-align:right; -webkit-user-select:text; user-select:text; }
  .toast .toast-action:active{ background:color-mix(in srgb, var(--brand) 22%, transparent); }

  /* ---------- Co-purchase suggestion (onder add-bar) ---------- */
  .co-suggest{ display:flex; align-items:center; gap:8px; margin:8px 0 4px; padding:0 2px; font-size:var(--fs-sm); color:var(--ink-soft); animation:rowSlideIn var(--dur-slow) var(--ease-out) backwards; }
  .co-suggest.hide{ display:none; }
  .co-suggest .cs-lbl{ font-weight:var(--fw-medium); flex:0 0 auto; }
  .co-suggest .cs-pill{ display:inline-flex; align-items:center; gap:5px; background:var(--brand-2); color:var(--brand); border:0; border-radius:var(--r-pill); padding:5px 11px; font-size:var(--fs-sm); font-weight:var(--fw-bold); transition:transform var(--dur-instant) var(--ease-out); }
  .co-suggest .cs-pill:active{ transform:var(--press); filter:brightness(.96); }
  .co-suggest .cs-pill .plus{ font-weight:var(--fw-bold); font-size:var(--fs-md); line-height:1; }
  .co-suggest .cs-close{ margin-left:auto; border:0; background:transparent; color:var(--ink-faint); font-size:var(--fs-base); line-height:1; padding:4px 6px; border-radius:50%; }
  .co-suggest .cs-close:active{ background:var(--surface-3); }

  /* ---------- Prijs-hint in item-sheet ---------- */
  .price-hint{ font-size:var(--fs-xs); color:var(--ink-faint); margin:-6px 4px 12px; font-weight:var(--fw-medium); letter-spacing:.01em; }
  .price-hint b{ color:var(--ink-soft); font-weight:var(--fw-medium); }

  /* ---------- Auto-add badge in Vaste-rij ---------- */
  .vrow .vauto{ flex:0 0 auto; font-size:var(--fs-xs); font-weight:var(--fw-bold); color:var(--brand); background:var(--brand-2); padding:3px 7px; border-radius:var(--r-pill); margin-right:6px; letter-spacing:.04em; text-transform:uppercase; }
  .auto-add-toggle{ display:flex; align-items:center; gap:12px; padding:12px 4px 4px; }
  .auto-add-toggle .aat-label{ flex:1; font-size:var(--fs-md); }
  .auto-add-toggle .aat-label small{ display:block; font-size:var(--fs-xs); color:var(--ink-soft); margin-top:2px; }

  /* ---------- Hero empty-state ---------- */
  .empty.hero .ico{ width:clamp(150px, 38vw, 220px); height:auto; aspect-ratio:120/110; background:transparent; border-radius:0; }
  .empty.hero .ico svg{ width:100%; height:100%; color:var(--ink-decorative); opacity:1; }
  .empty.hero h2{ margin-top:6px; }

  /* ---------- Delight (Fase 3) ---------- */
  /* Confetti — subtiel, kort, brand-kleuren */
  .confetti-layer{ position:absolute; inset:0; pointer-events:none; z-index:90; overflow:hidden; }
  .confetti-bit{ position:absolute; top:-12px; width:8px; height:10px; border-radius:2px; opacity:0; will-change:transform,opacity; animation:confetti-fall var(--dur-celebrate) var(--ease-out) forwards; }
  @keyframes confetti-fall{
    0%{ opacity:1; transform:translateY(-10px) rotate(0deg); }
    100%{ opacity:0; transform:translateY(70vh) rotate(360deg); }
  }
  /* Fly-to-avatar — item vliegt naar de vriend-avatar bij versturen */
  .fly-bit{ position:absolute; z-index:96; pointer-events:none; background:var(--brand); color:var(--on-brand); font-size:var(--fs-sm); font-weight:var(--fw-medium); padding:6px 12px; border-radius:var(--r-pill); box-shadow:var(--el-2); white-space:nowrap; will-change:transform,opacity; }
  /* Presence — "kijkt mee" pulserende stip op online leden */
  .av.live{ position:relative; }
  .av.live::after{ content:""; position:absolute; right:-1px; bottom:-1px; width:9px; height:9px; border-radius:50%; background:var(--brand); border:2px solid var(--bg); animation:live-pulse 2s ease-in-out infinite; }
  @keyframes live-pulse{ 0%,100%{ box-shadow:0 0 0 0 color-mix(in srgb, var(--brand) 50%, transparent);} 50%{ box-shadow:0 0 0 5px transparent;} }
  .presence-bar{ display:flex; align-items:center; gap:7px; margin:2px 4px 8px; font-size:var(--fs-sm); color:var(--brand); font-weight:var(--fw-medium); animation:rowSlideIn var(--dur-slow) var(--ease-out) backwards; }
  .presence-bar.empty{ display:none; }
  .presence-bar .pb-dot{ width:8px; height:8px; border-radius:50%; background:var(--brand); flex:0 0 auto; animation:live-pulse 2s ease-in-out infinite; }

  @media (prefers-reduced-motion: reduce){
    /* Decoratieve beweging uit; essentiële feedback (vinkje, sheet-positie) blijft als korte cross-fade */
    .confetti-bit, .fly-bit{ display:none !important; }
    .view.active, .ac-list.show, .row.entering, .co-suggest, .presence-bar, .shop-screen.show{ animation:none !important; }
    .av.live::after, .presence-bar .pb-dot, .ptr.spin svg{ animation:none !important; }
    .check svg path{ stroke-dashoffset:0 !important; animation:none !important; }
    .sheet, .sheet.show{ transition:opacity var(--dur-fade) linear, visibility 0s !important; transform:none !important; opacity:0; }
    .sheet.show{ opacity:1; }
    .scrim{ transition:opacity var(--dur-fade) linear !important; }
  }

  @media (max-width:359px){
    .shop-foot-row .shop-finish{ white-space:nowrap; font-size:var(--fs-md); padding:14px 12px; }
    .shop-hide{ padding:9px 10px; font-size:var(--fs-xs); }
    :root{
      --app-max-width: calc(100vw - 4px);
      --app-padding: clamp(10px, 2.2vw, 12px);
      --tap-size: clamp(38px, 13vw, 42px);
      --tap-size-sm: clamp(28px, 10vw, 31px);

      --subhead-size: 12px;
      --body-size: 16px;
      --totals-space: 172px;
    }
    .topbar{ height:calc(var(--safe-t) + 46px); }
    .largehead{ padding-top:calc(var(--safe-t) + 44px); }
    .addwrap{ left:max(8px, env(safe-area-inset-left)); right:max(8px, env(safe-area-inset-right)); }
    .topbar .share-top,
    .topbar .gear{ top:calc(var(--safe-t) + 6px); }
    .ctitle{ font-size:var(--fs-lg); }
  }

  /* ---------- Telefoon-landschap (844x390, 932x430): compacte kop, bredere kaart, sheet als dialoog ---------- */
  @media (max-height:480px) and (orientation:landscape){
    :root{ --tap-size:40px; --tap-size-sm:34px; --totals-space:150px; --app-max-width:min(760px, calc(100vw - 48px)); }
    h1{ font-size:var(--fs-2xl); }
    .topbar{ height:calc(var(--safe-t) + 42px); }
    .topbar .gear, .topbar .share-top{ top:calc(var(--safe-t) + 3px); }
    .topbar .offline-badge{ top:calc(var(--safe-t) + 10px); }
    .largehead{ padding:calc(var(--safe-t) + 46px) 4px 2px; display:flex; flex-wrap:wrap; align-items:center; gap:2px 16px; }
    .largehead h1{ margin:0; order:0; }
    .largehead .view-seg{ order:1; margin:0 0 0 auto; }
    .largehead .subhead{ order:2; flex-basis:100%; }
    #list-switch-wrap{ order:3; flex-basis:100%; }
    .addwrap{ bottom:calc(max(var(--app-padding), var(--safe-b)) + 6px); }
    .pad-bottom{ height:calc(var(--safe-b) + 76px); }
    .ac-list{ max-height:42vh; }
    .emoji-picker{ grid-template-columns:repeat(12, 1fr); }
    .shop-enter-btn{ padding:10px; margin-bottom:10px; }
    .section{ margin-top:14px; }
    .empty{ padding:24px 20px; }
    #open-list{ display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); column-gap:20px; align-items:start; }
  }

  /* ---------- Rasters vanaf 768px (zonder hoogte-guard: ook lage desktop-vensters) ---------- */
  @media (min-width:768px){
    #open-list{ display:grid; grid-template-columns:repeat(auto-fill, minmax(380px, 1fr)); column-gap:24px; align-items:start; }
    #open-list > .empty, #open-list > .search-empty, #open-list > .quick-start{ grid-column:1 / -1; }
    .quick-start{ max-width:640px; margin-inline:auto; }
    .qs-actions{ flex-direction:row; flex-wrap:wrap; }
    .qs-actions .mbtn{ flex:1 1 220px; }
    #done-list ul.list{ display:grid; grid-template-columns:repeat(auto-fill, minmax(380px, 1fr)); gap:8px 24px; }
    .shop-body{ display:grid; grid-template-columns:repeat(auto-fill, minmax(340px, 1fr)); gap:0 20px; align-content:start; align-items:start; }
    .shop-body > .shop-empty, .shop-body > .shop-alldone{ grid-column:1 / -1; }
    .shop-foot{ flex-direction:row; align-items:center; }
    .shop-foot .shop-add{ flex:1; }
    .shop-foot-row{ flex:0 0 auto; }
    .shop-foot-row .shop-finish{ min-width:200px; }
    .emoji-picker{ grid-template-columns:repeat(auto-fill, minmax(44px, 1fr)); }
    .send-screen{ padding-inline:max(24px, calc((100% - 600px) / 2)); }
    .empty.hero, .banner{ max-width:560px; margin-inline:auto; }
  }
  /* ---------- Tablet-portret (iPad 768/834): tokens — min-height sluit telefoon-landschap uit ---------- */
  @media (min-width:768px) and (min-height:600px){
    :root{
      --app-max-width: min(840px, calc(100vw - 72px));
      --app-padding: clamp(20px, 4vw, 28px);
      --tap-size: clamp(46px, 7.5vw, 52px);
      --tap-size-sm: clamp(34px, 6vw, 38px);
      --totals-space: 188px;
    }
    .topbar .share-top{ right:calc(max(12px, env(safe-area-inset-right)) + var(--tap-size-sm)); }
    .topbar{ height:calc(var(--safe-t) + 56px); }
    .largehead{ padding-top:calc(var(--safe-t) + 66px); padding-left:4px; padding-right:4px; }
    #main{ padding-left:max(var(--app-padding), env(safe-area-inset-left)); padding-right:max(var(--app-padding), env(safe-area-inset-right)); }
    .section{ margin-left:4px; margin-right:4px; }
    .chip{ padding:9px 14px; }
  }
  /* ---------- Sheet als gecentreerde dialoog: tablet-portret én telefoon-landschap (JS: MQ_DIALOG) ---------- */
  @media (min-width:768px) and (min-height:600px), (max-height:480px) and (orientation:landscape){
    .sheet{ left:50%; right:auto; top:50%; bottom:auto; margin:0; width:min(560px, calc(100% - 48px)); max-height:calc(100% - 48px); border-radius:var(--r-xl); box-shadow:var(--el-3); transform:translate(-50%, -50%) translateY(12px) scale(.98); opacity:0; transition:transform var(--dur-base) var(--ease-out), opacity var(--dur-fade) linear, visibility 0s linear var(--dur-base); }
    .sheet.show{ transform:translate(-50%, -50%); opacity:1; transition:transform var(--dur-base) var(--ease-out), opacity var(--dur-fade) linear, visibility 0s; }
    body.kb-open .sheet{ top:calc((100% - var(--kb-lift, 0px)) / 2); bottom:auto; max-height:calc(100% - var(--kb-lift, 0px) - 24px); }
    .grip{ display:none; }
    .sheet-x.sheet-x{ display:flex; }
    .sheet h3{ padding-right:44px; }
  }
  /* ---------- Desktop + iPad-landschap: gecentreerde kaart, zijpaneel (iPad Pro-portret houdt de dialoog) ---------- */
  @media (min-width:1024px) and (orientation:landscape), (min-width:1200px){
    :root{
      --app-max-width: min(1040px, calc(100vw - 96px));
      --app-padding: clamp(24px, 3.5vw, 36px);
      --tap-size: clamp(48px, 6vw, 54px);
      --tap-size-sm: clamp(36px, 4.5vw, 40px);
      --totals-space: 0px;
      --card-inset: 14px;
      --panel-w: 400px;
    }
    /* kaart: hoogte = viewport − 2×inset → onderrand + schaduw altijd zichtbaar (clip zit op html,body) */
    .app{ height:calc(100% - var(--card-inset) * 2); margin:var(--card-inset) auto; padding-bottom:0; border-radius:var(--r-xl); box-shadow:var(--el-3); overflow:clip; }
    .topbar{ width:min(100%, var(--app-max-width)); }
    .topbar .ctitle{ max-width:64vw; }
    /* add-balk uitgelijnd met de rijen (zelfde inset als #main); krimpt als het zijpaneel open is */
    .addwrap{ left:calc(50vw - var(--app-max-width) / 2 + max(var(--app-padding), env(safe-area-inset-left))); right:auto; margin:0; width:calc(var(--app-max-width) - max(var(--app-padding), env(safe-area-inset-left)) - max(var(--app-padding), env(safe-area-inset-right))); bottom:calc(var(--card-inset) + 22px); transition:bottom var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-out), opacity var(--dur-fade) linear, width var(--dur-slow) var(--ease-out); }
    body.sheet-open .addwrap{ transform:none; opacity:1; pointer-events:none; width:calc(var(--app-max-width) - var(--panel-w) - max(var(--app-padding), env(safe-area-inset-left)) - max(var(--app-padding), env(safe-area-inset-right)) - 12px); }
    .pad-bottom{ height:calc(var(--safe-b) + 112px); }
    .pad-bottom.with-total{ height:calc(var(--safe-b) + 200px); }
    body.has-total #main{ bottom:0; }
    .totals{ left:auto; right:var(--app-padding); width:min(400px, 100%); transform:none; bottom:96px; padding:0; margin:0; }
    .totals-inner{ width:100%; }
    .sheet{ left:auto; right:0; top:0; bottom:0; margin:0; width:var(--panel-w); max-width:none; height:100%; max-height:none; border-radius:0; border-left:1px solid var(--line); box-shadow:var(--el-3); opacity:1; --sheet-pad-x:24px; --sheet-pad-b:calc(24px + var(--safe-b)); padding:16px var(--sheet-pad-x) var(--sheet-pad-b); transform:translateX(100%); transition:transform var(--dur-slow) var(--ease-out), visibility 0s linear var(--dur-slow); }
    .sheet.show{ transform:none; opacity:1; transition:transform var(--dur-slow) var(--ease-out), visibility 0s; }
    body.kb-open .sheet{ top:0; bottom:0; max-height:none; }
    .sheet h3{ margin-top:6px; padding-right:44px; }
    .sheet .catscroll{ flex-wrap:wrap; overflow:visible; margin:0 0 8px; padding:0 0 4px; }
    .grip{ display:none; }
    .sheet-x.sheet-x{ display:flex; }
    .scrim{ background:var(--scrim-panel); }
    body.sheet-open .toast{ left:calc(50% - var(--panel-w) / 2); }   /* toast midden in het zichtbare deel naast het paneel */
    .shop-screen{ padding-inline:max(24px, calc((100% - 880px) / 2)); }
    .shop-enter-btn{ width:auto; min-width:300px; padding-inline:28px; }
  }
  @media (min-width:1366px){
    :root{ --app-max-width: min(1120px, calc(100vw - 160px)); --panel-w: 440px; --card-inset: 20px; }
    .largehead{ display:grid; grid-template-columns:1fr auto; grid-template-areas:"h1 seg" "sub seg" "sw sw"; align-items:center; column-gap:24px; }
    .largehead h1{ grid-area:h1; }
    .largehead .subhead{ grid-area:sub; }
    .largehead .view-seg{ grid-area:seg; margin:0; }
    #list-switch-wrap{ grid-area:sw; }
  }

  /* ---------- Schap-iconen: lijn-icoon in schap-kleur, optioneel in een getinte bubbel ---------- */
  .shelf-ico{ display:inline-flex; align-items:center; justify-content:center; width:var(--icon-md); height:var(--icon-md); color:var(--shelf-ink, var(--ink-soft)); flex:0 0 auto; line-height:1; }
  .shelf-ico svg{ width:100%; height:100%; display:block; }
  .shelf-ico.shelf-bubble{ width:2.25rem; height:2.25rem; border-radius:var(--r-md); background:var(--shelf-tint, var(--surface-3)); }
  .shelf-ico.shelf-bubble svg{ width:var(--icon-md); height:var(--icon-md); }
  .shelf-ico.is-emoji .emoji{ font-size:1.05em; line-height:1; }
