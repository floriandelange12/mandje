  :root{
    /* ===== Kleur — "marktkraam op papier" (ratio's: tekst-op-vlak, WCAG 2.x; bewaakt door tests/contrast.js) ===== */
    --bg:#F3EDE3;              /* kraft-crème pagina */
    --surface-1:#FFFCF7;       /* kaart (niveau 1) */
    --surface-2:#FAF6EE;       /* tonaal óp een kaart (chips, inputs, done-kaart) */
    --surface-3:#E8DFCF;       /* tonaal óp de pagina (seg, qty, search) — dieper dan bg */
    --ink:#1F1B15;             /* 14,7:1 op bg */
    --ink-soft:#5A5347;        /* 6,5:1 op bg */
    --ink-faint:#675F51;       /* 5,3:1 op bg · 4,7:1 op surface-3 (was 2,3:1) */
    --ink-decorative:#B0A796;  /* alleen grip/chevrons/stippen — nooit tekst */
    --line:#D9CFBC;            /* hairline tussen group-rijen */
    --line-strong:#C9BEAA;     /* input-rand in rust */
    --line-control:#8F8676;    /* rand van check/switch-uit (≥3:1) */
    --brand:#24593F;           /* Laurier — 7,0:1 als tekst op bg */
    --brand-strong:#1C4A33;    /* hover/active */
    --brand-2:#DCEADF;         /* tint-vlak; brand-tekst erop 6,6:1 */
    --on-brand:#FFFFFF;        /* 8,2:1 op brand */
    --accent:#8A5410;          /* Honing — 'bijna op'; 5,4:1 op bg */
    --accent-2:#F6E7C9;
    --on-accent:#FFFFFF;       /* 6,3:1 op accent */
    --danger:#B0392A;          /* Paprika — 'op' / verwijderen; 5,2:1 op bg */
    --danger-2:#F8DED9;
    --on-danger:#FFFFFF;       /* 6,1:1 op danger */
    --focus:#2A6B4B;           /* ring 5,5:1 op bg */
    --scrim:rgba(31,27,21,.42);
    --scrim-panel:rgba(31,27,21,.25);
    --glass:color-mix(in srgb, var(--surface-1) 84%, transparent);
    --blur:saturate(160%) blur(18px);
    /* Elevatie: warm-getinte schaduwen (licht); in donker lichtere laag + inset-hairline */
    --shadow-tint:46,36,20;
    --el-0:none;
    --el-1:0 1px 1px rgba(var(--shadow-tint),.04), 0 2px 6px -2px rgba(var(--shadow-tint),.09);
    --el-2:0 2px 4px rgba(var(--shadow-tint),.05), 0 10px 24px -8px rgba(var(--shadow-tint),.16);
    --el-3:0 4px 10px rgba(var(--shadow-tint),.06), 0 24px 48px -12px rgba(var(--shadow-tint),.26);
    --el-4:0 8px 16px rgba(var(--shadow-tint),.08), 0 32px 64px -16px rgba(var(--shadow-tint),.34);
    --shadow-sheet:0 -10px 40px rgba(var(--shadow-tint),.18);
    /* Schap-tinten (6 groepen): tint = bubbel-achtergrond, ink = icoon/label (≥5,9:1 op tint) */
    --shelf-vers-tint:#DCEADF;  --shelf-vers-ink:#24593F;
    --shelf-graan-tint:#F3E4C6; --shelf-graan-ink:#6E4A0E;
    --shelf-koel-tint:#DCE8EF;  --shelf-koel-ink:#2B5468;
    --shelf-eiwit-tint:#F4DED6; --shelf-eiwit-ink:#8A3B2A;
    --shelf-zorg-tint:#E7E0EF;  --shelf-zorg-ink:#553B78;
    --shelf-huis-tint:#E8E2D8;  --shelf-huis-ink:#4E473D;
    --member-text-mix:0%;      /* lidkleur als tekst: licht puur */
    --toast-bg:var(--ink); --toast-ink:var(--bg); --toast-action:#9FD9B8;   /* 10,7:1 op ink */

    /* ===== Typografie ===== */
    --font:"Avenir Next","Nunito","Segoe UI","SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif;
    --display:"Fraunces", ui-serif, Georgia, "Times New Roman", serif;   /* alleen titels, sheet-koppen, grote bedragen */
    --mono:ui-monospace, SFMono-Regular, Menlo, monospace;
    --fs-xs:clamp(0.75rem, 0.72rem + 0.15vw, 0.8125rem);    /* 12→13 badges, labels */
    --fs-sm:clamp(0.8125rem, 0.78rem + 0.20vw, 0.875rem);   /* 13→14 meta, hints, sectiekop */

  .row .behind{ position:absolute; inset:1px; border-radius:calc(var(--r-lg) - 1px); background:var(--danger); opacity:0; display:flex; align-items:center; justify-content:flex-end; gap:8px; padding-right:22px; color:var(--on-danger); font-weight:var(--fw-medium); font-size:var(--fs-md); transition:opacity .12s linear; }
  .row.swiping .behind{ opacity:1; }
  .row .behind svg{ width:20px; height:20px; }
  .card{ position:relative; display:flex; align-items:center; gap:13px; background:inherit; border:0; border-radius:var(--r-lg); padding:clamp(10px, 2.5vw, 12px) clamp(12px, 2.8vw, 14px); box-shadow:none; transition:transform var(--dur-base) var(--ease-out); touch-action:pan-y; min-height:var(--tap); }

  .check{ position:relative; flex:0 0 auto; width:var(--tap-size-sm); height:var(--tap-size-sm); padding:0; margin:0; border-radius:50%; border:2px solid var(--line-control); display:flex; align-items:center; justify-content:center; background:transparent; transition:background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out); }
  .check::before{ content:""; position:absolute; inset:-6px; }
  .check svg{ width:19px; height:19px; opacity:0; transform:scale(.3); transition:opacity var(--dur-fast) var(--ease-out), transform var(--dur-base) var(--ease-out); }
  .row.done .check{ background:var(--brand); border-color:var(--brand); }
  .row.done .check svg{ opacity:1; transform:scale(1); }

  .meta{ flex:1; min-width:0; }
  .nm{ font-size:var(--fs-base); font-weight:var(--fw-medium); letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:color var(--dur-fast) var(--ease-inout); }
  .nm{ position:relative; width:fit-content; max-width:100%; }   /* doorstreep-lijn zo breed als de tekst */
  .nm::after{ content:""; position:absolute; left:0; top:calc(50% + 1px); width:100%; height:1.5px; background:currentColor; transform:scaleX(0); transform-origin:left center; transition:transform var(--dur-base) var(--ease-out); pointer-events:none; }
  .row.done .nm{ color:var(--ink-faint); }
  .row.done .nm::after{ transform:scaleX(1); }
  .row.flash .card{ animation:rowFlash 1.2s var(--ease-out); }
  @keyframes rowFlash{ 0%{ box-shadow:0 0 0 0 var(--brand-2); background:var(--brand-2); } 100%{ box-shadow:0 0 0 12px transparent; background:var(--surface-1); } }
  .sub2{ font-size:var(--fs-sm); color:var(--ink-soft); margin-top:1px; display:flex; align-items:center; gap:6px; }
  .sub2 .pill-due{ color:var(--accent); font-weight:var(--fw-bold); }

  .qty{ flex:0 0 auto; display:flex; align-items:center; background:var(--surface-3); border-radius:var(--r-sm); overflow:visible; }
  .qty button{ position:relative; width:var(--tap-size-sm); height:var(--tap-size-sm); border:0; background:transparent; font-size:var(--fs-lg); color:var(--brand); border-radius:var(--r-sm); }
  .qty button::before{ content:""; position:absolute; inset:-7px; }
  .qty button:active{ background:var(--brand-2); }
  .qty span{ min-width:20px; text-align:center; font-size:var(--fs-md); font-weight:var(--fw-bold); font-variant-numeric:tabular-nums; }
  .price{ flex:0 0 auto; min-width:58px; text-align:right; font-size:var(--fs-base); font-weight:var(--fw-bold); font-variant-numeric:tabular-nums; }
  .row.done .price{ color:var(--ink-faint); }

  /* Chips (bijna op / quick add) */
  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{ display:inline-flex; align-items:center; gap:7px; background:var(--surface-3); border:0; border-radius:var(--r-pill); padding:8px 13px; font-size:var(--fs-md); font-weight:var(--fw-medium); box-shadow:none; transition:transform var(--dur-instant) var(--ease-out), background-color var(--dur-fast) var(--ease-inout); max-width:100%; min-height:var(--tap-sm); }
  .chip span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chip:active{ transform:var(--press); }
  .chip .emoji{ font-size:var(--fs-base); }
  .chip .plus{ color:var(--brand); font-weight:var(--fw-bold); font-size:var(--fs-lg); margin-left:1px; }
  .chip.amber{ background:var(--accent-2); color:var(--accent); }
  .chip.amber .plus{ color:var(--accent); }
  /* bijna-op-chip met eigen verberg-knop */
  .chip-wrap{ display:inline-flex; align-items:stretch; }
  .chip-wrap .chip{ border-radius:var(--r-pill) 0 0 var(--r-pill); padding-right:10px; }
  .chip-x{ border:0; margin-left:1px; padding:0 11px 0 7px; background:var(--accent-2); color:var(--accent); border-radius:0 var(--r-pill) var(--r-pill) 0; font-size:var(--fs-sm); font-weight:var(--fw-bold); opacity:.8; }
  .chip-x:active{ opacity:1; }
  /* "Schap kiezen" op rijen in Overig */
  .pick-cat{ border:0; background:var(--accent-2); color:var(--accent); border-radius:var(--r-pill); padding:2px 9px; font-size:var(--fs-xs); font-weight:var(--fw-bold); line-height:1.5; vertical-align:middle; }
  /* Startzet bij lege lijst + Vaak gekocht */
  .quick-start{ margin:4px 4px 0; }
  .qs-lbl{ font-size:var(--fs-sm); font-weight:var(--fw-bold); letter-spacing:.04em; text-transform:uppercase; color:var(--ink-soft); margin:18px 2px 8px; }
  .qs-actions{ display:flex; flex-direction:column; gap:8px; margin-top:16px; }
  .qs-actions .mbtn{ margin:0; }
  .freq-chips{ margin:0 6px 12px; }
  /* winkel-kiezer (looproute) */
  .store-pick{ display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 0; }

  .shop-title small{ display:block; font-family:var(--font); font-size:var(--fs-xs); font-weight:var(--fw-medium); letter-spacing:.04em; text-transform:uppercase; color:var(--ink-soft); margin-top:-2px; }
  .shop-title small:empty{ display:none; }
  .mbtn.inline.soft{ background:var(--surface-3); color:var(--danger); }
  /* weekritueel */
  .ritual{ position:relative; background:var(--brand-2); border-radius:var(--r-lg); padding:14px 44px 14px 16px; margin:4px 0 12px; }
  .ritual h4{ font-family:var(--display); font-size:var(--fs-xl); font-weight:var(--fw-medium); letter-spacing:var(--ls-display); margin:0 0 2px; color:var(--brand); }
  .ritual p{ margin:0 0 10px; color:var(--ink-soft); font-size:var(--fs-md); }
  .ritual .chips .chip{ background:var(--surface-1); box-shadow:var(--el-1); }
  .ritual .r-x{ position:absolute; top:10px; right:10px; width:32px; height:32px; border:0; background:transparent; color:var(--brand); border-radius:50%; font-size:var(--fs-md); }
  /* catalogusbeheer */
  .cm-list{ margin:0 -4px; }
  .cm-row{ display:flex; align-items:center; gap:10px; padding:10px 6px; border-bottom:1px solid var(--line); }
  .cm-row.hidden-entry .cm-title{ opacity:.55; text-decoration:line-through; }
  .cm-name{ flex:1; min-width:0; }
  .cm-title{ font-size:var(--fs-base); font-weight:var(--fw-medium); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cm-meta{ font-size:var(--fs-xs); color:var(--ink-faint); }
  .cm-more{ flex:0 0 auto; width:var(--tap-size-sm); height:var(--tap-size-sm); border:0; border-radius:var(--r-sm); background:var(--surface-3); color:var(--ink-soft); font-size:var(--fs-lg); }
  .cm-more[aria-expanded="true"]{ background:var(--brand-2); color:var(--brand); }

  .cm-acts button{ border:0; background:var(--surface-3); color:var(--ink); border-radius:var(--r-pill); padding:8px 12px; font-size:var(--fs-sm); font-weight:var(--fw-medium); min-height:var(--tap-size-sm); }
  .cm-acts button.danger{ color:var(--danger); }
  .banner{ background:linear-gradient(135deg, var(--accent-2), color-mix(in srgb, var(--accent-2) 60%, var(--surface-1))); border:1px solid color-mix(in srgb, var(--accent) 22%, transparent); border-radius:var(--r-lg); padding:14px; }
  .banner .b-top{ display:flex; align-items:center; gap:8px; font-weight:var(--fw-bold); font-size:var(--fs-md); color:var(--accent); margin-bottom:10px; }
  .banner .b-top svg{ width:17px; height:17px; flex:0 0 auto; }
  .banner .b-top .b-title{ flex:1; min-width:0; }
  .banner .b-dismiss{ flex:0 0 auto; width:24px; height:24px; border:0; padding:0; margin:-4px -4px -4px 0; background:transparent; color:var(--accent); opacity:.7; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:var(--fs-sm); line-height:1; cursor:pointer; }
  .banner .b-dismiss:active{ opacity:1; background:color-mix(in srgb, var(--accent) 18%, transparent); }

  /* Vaste-tab card */
  .vrow{ display:flex; align-items:center; gap:13px; background:var(--surface-1); border:0; border-radius:var(--r-lg); padding:clamp(11px, 2.8vw, 13px) clamp(12px, 2.8vw, 14px); box-shadow:var(--el-1); }
  .vrow .vemoji{ flex:0 0 auto; width:40px; height:40px; border-radius:var(--r-md); background:var(--brand-2); display:flex; align-items:center; justify-content:center; font-size:var(--fs-xl); }
  .vrow .vmeta{ flex:1; min-width:0; }
  .vrow .vname{ font-size:var(--fs-lg); font-weight:var(--fw-medium); }
  .vrow .vcad{ font-size:var(--fs-sm); color:var(--ink-soft); margin-top:1px; }
  .vrow .vcad b{ color:var(--accent); }
  .vrow .vadd{ flex:0 0 auto; width:38px; height:38px; border-radius:50%; border:0; background:var(--brand); color:var(--on-brand); font-size:var(--fs-xl); box-shadow:var(--el-1); transition:transform var(--dur-instant) var(--ease-out); }
  .vrow .vadd:active{ transform:var(--press); }
  .vrow.onlist .vadd{ background:var(--surface-3); color:var(--brand); }

  /* Empty state */
  .empty{ text-align:center; padding:54px 26px; color:var(--ink-soft); }
  .empty .ico{ width:72px; height:72px; margin:0 auto 16px; border-radius:var(--r-xl); background:var(--brand-2); display:flex; align-items:center; justify-content:center; }
  .empty .ico svg{ width:34px; height:34px; color:var(--brand); }
  .empty h2{ font-family:var(--display); font-size:var(--fs-2xl); font-weight:var(--fw-medium); line-height:var(--lh-heading); color:var(--ink); margin:0 0 7px; letter-spacing:-.01em; }
  .empty p{ font-size:var(--fs-md); margin:0; line-height:1.5; }

  /* ---------- Totals bar (boven floating add-bar) ---------- */
  .totals{ position:absolute; left:0; right:0; bottom:calc(max(16px, var(--safe-b)) + 90px); z-index:25; padding:0 max(12px, env(safe-area-inset-right)) 8px max(12px, env(safe-area-inset-left)); pointer-events:none; transition:opacity var(--dur-base) var(--ease-inout), transform var(--dur-base) var(--ease-inout), visibility 0s; }
  /* visibility:hidden haalt 'm uit de a11y-tree én tab-volgorde wanneer verborgen;
     0s-delay-na-transitie zodat de fade-out nog zichtbaar afspeelt */
  .totals.hide{ opacity:0; transform:translateY(8px); pointer-events:none; visibility:hidden; transition:opacity var(--dur-base) var(--ease-inout), transform var(--dur-base) var(--ease-inout), visibility 0s linear var(--dur-base); }
  .totals-inner{ background:var(--glass); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); border:0; border-radius:var(--r-lg); box-shadow:var(--el-2); padding:9px 16px 10px; pointer-events:auto; }
  .trow{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .t-sum{ display:flex; align-items:baseline; gap:8px; min-width:0; }
  .trow .lbl{ font-size:var(--fs-sm); font-weight:var(--fw-medium); color:var(--ink-soft); }
  .trow .amt{ font-family:var(--display); font-size:var(--fs-xl); font-weight:var(--fw-medium); letter-spacing:var(--ls-num); line-height:1; font-variant-numeric:tabular-nums; }
  .t-hint{ font-size:var(--fs-xs); color:var(--ink-faint); margin:5px 0 0; font-style:italic; }
  /* progress + "in mandje" op één compacte regel */
  #t-prog-wrap{ display:flex; align-items:center; gap:10px; margin-top:7px; }
  .pbar{ flex:1; height:5px; border-radius:var(--r-pill); background:var(--surface-3); overflow:hidden; margin:0; }
  .pbar > i{ display:block; height:100%; background:var(--brand); border-radius:var(--r-pill); transition:width var(--dur-slow) var(--ease-out); }
  .trow .cart, #t-prog-wrap .cart{ flex:0 0 auto; font-size:var(--fs-xs); font-weight:var(--fw-medium); color:var(--brand); white-space:nowrap; }
  .finish{ border:0; background:var(--brand); color:var(--on-brand); font-weight:var(--fw-bold); font-size:var(--fs-md); padding:8px 14px; border-radius:var(--r-md); transition:transform var(--dur-instant) var(--ease-out); }
  .finish:active{ transform:var(--press); }
  .forgot-row{ display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 4px; align-items:center; }
  .forgot-row .forgot-lbl{ font-size:var(--fs-xs); font-weight:var(--fw-medium); color:var(--ink-soft); margin-right:2px; }
  .forgot-row .forgot-pill{ display:inline-flex; align-items:center; gap:5px; padding:5px 10px; background:var(--accent-2); color:var(--accent); border:0; border-radius:var(--r-pill); font-size:var(--fs-sm); font-weight:var(--fw-bold); transition:transform var(--dur-instant) var(--ease-out); }
  .forgot-row .forgot-pill:active{ transform:var(--press); filter:brightness(.96); }
  .forgot-row .forgot-pill .plus{ font-weight:var(--fw-bold); font-size:var(--fs-md); line-height:1; }
  .finish-inline{ display:flex; justify-content:center; margin:14px 0 4px; }
  .finish-inline-btn{ border:0; background:var(--brand); color:var(--on-brand); font-weight:var(--fw-bold); font-size:var(--fs-base); padding:13px 28px; border-radius:var(--r-md); box-shadow:var(--el-1); transition:transform var(--dur-instant) var(--ease-out), filter var(--dur-instant) var(--ease-inout); }
  .finish-inline-btn:active{ transform:var(--press); filter:brightness(.94); }

  /* ---------- Lijst/Vaste-segment (onder de titel) ---------- */
  .view-seg{ display:inline-flex; margin:10px 0 2px; background:var(--surface-3); border-radius:var(--r-sm); padding:3px; }

  .view-seg button.on{ background:var(--surface-1); color:var(--ink); box-shadow:var(--el-1); }

  /* ---------- Views ---------- */
  .view{ display:none; }
  .view.active{ display:block; animation:viewSlideIn var(--dur-base) var(--ease-out); }
  @keyframes viewSlideIn{ from{ opacity:0; transform:translateY(-6px);} to{ opacity:1; transform:none;} }

  /* ---------- Settings (Meer) ---------- */
  .group{ background:var(--surface-1); border:0; border-radius:var(--r-lg); overflow:hidden; box-shadow:var(--el-1); margin-bottom:18px; }

  .seg button{ border:0; background:transparent; padding:6px 12px; border-radius:var(--r-sm); font-size:var(--fs-md); font-weight:var(--fw-medium); color:var(--ink-soft); }
  .seg button.on{ background:var(--surface-1); color:var(--ink); box-shadow:var(--el-1); }
  .switch{ width:50px; height:30px; border-radius:var(--r-pill); background:var(--surface-3); border:1px solid var(--line-control); position:relative; transition:background-color var(--dur-base) var(--ease-inout), border-color var(--dur-base) var(--ease-inout); flex:0 0 auto; }
  .switch.on{ background:var(--brand); border-color:transparent; }
  .switch::after{ content:""; position:absolute; top:2px; left:2px; width:24px; height:24px; border-radius:50%; background:var(--surface-1); box-shadow:0 1px 3px rgba(0,0,0,.3); transition:transform var(--dur-base) var(--ease-spring); }
  .switch.on::after{ background:var(--on-brand); }
  .switch.on::after{ transform:translateX(20px); }
  .mbtn{ width:100%; border:0; background:var(--surface-1); border-radius:var(--r-md); padding:14px; font-size:var(--fs-base); font-weight:var(--fw-medium); box-shadow:var(--el-1); margin-bottom:10px; min-height:var(--tap-size); }

  .mbtn.primary{ background:var(--brand); color:var(--on-brand); }
  .mbtn.primary:active{ filter:brightness(.94); background:var(--brand); }
  .mbtn:active{ background:var(--surface-3); }
  /* Kleur-kiezer chip (profiel) */
  .color-chip{ width:34px; height:34px; border-radius:50%; padding:0; border:0; flex:0 0 auto; }
  .color-chip.on{ outline:3px solid var(--ink); outline-offset:2px; }
  /* Gedeelde meta/ellipsis in lijst-/vrienden-rijen */
  .lsi-meta{ flex:1; min-width:0; }
  .lsi-text{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* Avatar (initialen of emoji) */
  .avatar{ border-radius:50%; display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .av.offline{ opacity:.5; }
  textarea.io{ width:100%; height:120px; border:1px solid var(--line-strong); border-radius:var(--r-md); background:var(--surface-2); padding:12px; font-size:var(--fs-sm); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; resize:none; -webkit-user-select:text; user-select:text; }
  .hint{ font-size:var(--fs-sm); color:var(--ink-soft); line-height:1.5; margin:2px 6px 16px; }
  .grow .gval{ margin-left:auto; flex:0 0 auto; color:var(--ink-soft); font-size:var(--fs-md); font-variant-numeric:tabular-nums; }
  .grow .gval.ok{ color:var(--brand); font-weight:var(--fw-bold); }
  .grow.wrap{ flex-wrap:wrap; } .grow.wrap .glabel{ flex:1 1 auto; } .grow.wrap .seg{ margin-left:auto; }   /* segment mag op een smal scherm onder het label */
  .mbtn.inline{ width:auto; flex:0 0 auto; margin:0 0 0 auto; padding:10px 16px; min-height:var(--tap-size-sm); background:var(--brand); color:var(--on-brand); box-shadow:none; }
  .gsub b{ font-weight:var(--fw-bold); color:var(--ink); }

  /* ---------- Bottom sheet ---------- */
  .scrim{ position:absolute; inset:0; background:var(--scrim); opacity:0; z-index:50; transition:opacity var(--dur-slow) var(--ease-out); pointer-events:none; }
  .scrim.show{ opacity:1; pointer-events:auto; }
  .sheet{ position:absolute; left:0; right:0; bottom:0; z-index:51; background:var(--surface-1); border-radius:var(--r-xl) var(--r-xl) 0 0; box-shadow:var(--shadow-sheet); transform:translateY(110%); visibility:hidden; transition:transform var(--dur-slow) var(--ease-out), visibility 0s linear var(--dur-slow); --sheet-pad-x:18px; --sheet-pad-b:calc(18px + var(--safe-b)); padding:8px var(--sheet-pad-x) var(--sheet-pad-b); width:min(100%, var(--app-max-width)); max-width:var(--app-max-width); margin:0 auto; max-height:calc(100% - 80px); overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
  /* Gesloten sheet uit a11y-tree + tab-volgorde halen; visibility springt direct aan bij openen,

  #scrim2{ z-index:52; }
  #sheet2{ z-index:53; }
  .grip{ width:36px; height:4px; border-radius:var(--r-pill); background:var(--ink-decorative); margin:6px auto 14px; transition:background var(--dur-fast) var(--ease-inout); }
  .sheet h3{ font-family:var(--display); font-size:var(--fs-2xl); font-weight:var(--fw-medium); letter-spacing:var(--ls-display); line-height:var(--lh-heading); margin:0 0 16px; }
  .sheet-label{ font-size:var(--fs-xs); font-weight:var(--fw-bold); letter-spacing:.05em; text-transform:uppercase; color:var(--ink-soft); margin:14px 4px 8px; display:flex; align-items:center; gap:7px; }
  .sheet h3 + .sheet-label{ margin-top:6px; }
  .sheet-label .lbl-cap{ flex:1; }

  /* Actiebalk blijft onderin zichtbaar terwijl de sheet scrolt (negatieve marge/offset vangen de sheet-padding op) */
  .sheet-actions{ display:flex; gap:10px; position:sticky; bottom:calc(-1 * var(--sheet-pad-b, 0px)); z-index:2; margin:18px 0 calc(-1 * var(--sheet-pad-b, 0px)); padding:10px 0 var(--sheet-pad-b, 0px); background:var(--surface-1); }

  /* ---------- Toast ---------- */
  .toast{ position:absolute; left:50%; bottom:calc(var(--safe-b) + 92px); transform:translateX(-50%) translateY(16px); background:var(--ink); color:var(--bg); padding:11px 18px; border-radius:var(--r-md); font-size:var(--fs-md); font-weight:var(--fw-medium); opacity:0; z-index:95; pointer-events:none; box-shadow:var(--el-3); transition:opacity var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-out); max-width:min(var(--app-max-width), calc(100vw - 32px)); white-space:normal; text-align:center; line-height:1.35; }
  /* Alleen een ZICHTBARE toast vangt taps (pauze-op-aanraken); verborgen = pointer-events:none, ook met has-action */
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }

  /* Sheet open: toast bovenin, anders ligt hij midden over de sheet-inhoud */

  body.sheet-open .toast.show{ transform:translateX(-50%) translateY(0); }

  .shop-sec{ font-size:var(--fs-sm); font-weight:var(--fw-medium); letter-spacing:.04em; text-transform:uppercase; color:var(--ink-soft); margin:16px 4px 8px; display:flex; align-items:center; gap:8px; }

  .shop-row{ display:flex; align-items:center; gap:14px; width:100%; text-align:left; background:var(--surface-1); border:0; border-radius:var(--r-lg); padding:16px; margin-bottom:8px; box-shadow:var(--el-1); min-height:56px; transition:transform var(--dur-instant) var(--ease-out), background-color var(--dur-fast) var(--ease-inout), box-shadow var(--dur-fast) var(--ease-inout); }

  .shop-finish:active{ filter:brightness(.94); }

  /* ---------- Uniforme emoji-rendering ---------- */
  .emoji{ font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif; font-style:normal; font-weight:400; line-height:1; vertical-align:-1px; }

  /* ---------- Search-bar (Lijst-tab) ---------- */
  .search-bar{ position:relative; margin:6px 0 12px; display:flex; align-items:center; background:var(--surface-3); border:0; border-radius:var(--r-md); padding:9px 13px; box-shadow:none; max-height:52px; opacity:1; overflow:hidden; transition:max-height var(--dur-base) var(--ease-out), opacity var(--dur-base) var(--ease-out), margin var(--dur-base) var(--ease-out); }
  .search-bar.collapsed{ max-height:0; opacity:0; margin-top:0; margin-bottom:0; padding-top:0; padding-bottom:0; pointer-events:none; }
  .search-bar svg.lead{ width:16px; height:16px; color:var(--ink-faint); flex:0 0 16px; margin-right:9px; }
  .search-bar input{ flex:1; border:0; outline:0; background:transparent; font-size:var(--fs-input); padding:2px 0; -webkit-user-select:text; user-select:text; }
  .search-bar .search-clear{ flex:0 0 auto; width:22px; height:22px; border:0; padding:0; background:var(--surface-3); color:var(--ink-soft); border-radius:50%; display:flex; align-items:center; justify-content:center; margin-left:6px; font-size:var(--fs-sm); line-height:1; }
  .search-bar.empty .search-clear{ display:none; }

  /* ---------- Pull-to-refresh indicator ---------- */
  .ptr{ position:absolute; left:50%; top:calc(var(--safe-t) + 38px); transform:translate(-50%, -28px); width:36px; height:36px; border-radius:50%; background:var(--surface-1); border:0; box-shadow:var(--el-3); display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; z-index:35; transition:transform var(--dur-base) var(--ease-out), opacity var(--dur-base) var(--ease-inout); }
  .ptr.show{ opacity:1; transform:translate(-50%, var(--ptr-y, 8px)); }
  .ptr svg{ width:18px; height:18px; color:var(--brand); }
  .ptr.spin svg{ animation:ptr-spin 1s linear infinite; }
  @keyframes ptr-spin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }

  /* ---------- Sortable list (Meer-tab: schap-volgorde) ---------- */
  .sort-list{ display:flex; flex-direction:column; gap:6px; }
  /* Rij mag normaal verticaal scrollen; alleen het handvat vangt de sleep-gesture */
  .sort-row{ display:flex; align-items:center; gap:12px; padding:11px 14px; background:var(--surface-1); border:0; border-radius:var(--r-md); box-shadow:var(--el-1); touch-action:pan-y; user-select:none; -webkit-user-select:none; transition:transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-inout); }
  .sort-row.dragging{ transform:scale(1.02); box-shadow:var(--el-3); z-index:5; opacity:.95; }
  .sort-row .sr-emoji{ font-size:var(--fs-xl); width:30px; text-align:center; flex:0 0 auto; }
  .sort-row .sr-label{ flex:1; font-size:var(--fs-base); font-weight:var(--fw-medium); }
  .sort-row .sr-handle{ flex:0 0 auto; color:var(--ink-faint); width:40px; height:40px; margin:-8px -6px -8px 0; display:flex; align-items:center; justify-content:center; cursor:grab; touch-action:none; }
  .sort-row .sr-handle svg{ width:18px; height:18px; }
  .sort-row .sr-del{ flex:0 0 auto; border:0; background:transparent; color:var(--ink-faint); padding:4px 6px; font-size:var(--fs-sm); font-weight:var(--fw-medium); }
  .sort-row .sr-del:active{ color:var(--danger); }

  /* ---------- Emoji-picker (compact) ---------- */
  .emoji-picker{ display:grid; grid-template-columns:repeat(8, 1fr); gap:6px; margin:4px 0 8px; }
  .emoji-picker .ep-cell{ aspect-ratio:1; display:flex; align-items:center; justify-content:center; font-size:var(--fs-xl); border:0; background:var(--surface-3); border-radius:var(--r-sm); padding:0; transition:transform var(--dur-instant) var(--ease-out), background var(--dur-fast) var(--ease-inout); }
  .emoji-picker .ep-cell:active{ transform:var(--press); background:var(--surface-3); }
  .emoji-picker .ep-cell.on{ background:var(--brand-2); color:var(--brand); }

  /* ---------- Recente activiteit (in share-sheet) ---------- */
  .activity-row{ display:flex; align-items:center; gap:10px; padding:8px 4px; font-size:var(--fs-md); }
  .activity-row .ar-icon{ flex:0 0 auto; width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:var(--fs-sm); color:var(--on-brand); font-weight:var(--fw-bold); }
  .activity-row .ar-icon.add{ background:var(--brand); }
  .activity-row .ar-icon.done{ background:var(--accent); color:var(--on-accent); }
  .activity-row .ar-text{ flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--ink); }
  .activity-row .ar-text b{ font-weight:var(--fw-medium); }
  .activity-row .ar-time{ flex:0 0 auto; font-size:var(--fs-xs); color:var(--ink-faint); }

  /* ---------- Intro stappen (onboarding) ---------- */
  .intro-stage{ display:flex; flex-direction:column; align-items:center; padding:10px 4px 4px; min-height:280px; }
  .intro-card{ width:100%; max-width:340px; padding:28px 22px; background:var(--surface-1); border:0; border-radius:var(--r-xl); text-align:center; box-shadow:var(--el-1); margin-bottom:18px; }
  .intro-card .ic-glyph{ font-size:calc(var(--fs-3xl) * 1.4); margin-bottom:14px; line-height:1; }
  .intro-card h4{ font-family:var(--display); font-size:var(--fs-xl); font-weight:var(--fw-medium); letter-spacing:var(--ls-display); margin:0 0 8px; }
  .intro-card p{ font-size:var(--fs-md); line-height:1.45; color:var(--ink-soft); margin:0; }
  .intro-dots{ display:flex; gap:8px; margin:6px 0 18px; }
  .intro-dots .id-dot{ width:8px; height:8px; border-radius:50%; background:var(--surface-3); transition:background var(--dur-base) var(--ease-inout), width var(--dur-base) var(--ease-out); }
  .intro-dots .id-dot.on{ background:var(--brand); width:22px; border-radius:var(--r-pill); }
  /* Interactieve eerste stap: live demo van auto-categorisering */
  .intro-card-demo{ padding:24px 18px; }
  .intro-card-demo h4{ margin-bottom:6px; }
  .intro-card-demo p{ margin-bottom:16px; }
  .intro-demo{ width:100%; }
  .intro-demo .idemo-field{ display:flex; align-items:center; gap:9px; background:var(--surface-1); border:1.5px solid var(--brand); border-radius:var(--r-md); padding:11px 13px; box-shadow:var(--el-1); text-align:left; }
  .intro-demo .idemo-field .emoji{ font-size:var(--fs-lg); opacity:.7; }
  .intro-demo .idemo-field input{ flex:1; min-width:0; border:0; outline:0; background:transparent; font-size:var(--fs-input); -webkit-user-select:text; user-select:text; }
  .intro-demo .idemo-tries{ display:flex; flex-wrap:wrap; gap:7px; justify-content:center; margin:13px 0 2px; }
  .intro-demo .idemo-try{ border:0; background:var(--surface-3); color:var(--ink-soft); border-radius:var(--r-pill); padding:6px 13px; font-size:var(--fs-sm); font-weight:var(--fw-medium); }
  .intro-demo .idemo-try:active{ background:var(--surface-3); }
  .intro-demo .idemo-result{ display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; margin-top:16px; min-height:42px; opacity:0; transform:translateY(8px); transition:opacity var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-out); }
  .intro-demo .idemo-result.show{ opacity:1; transform:none; }
  .intro-demo .idemo-chip{ display:inline-flex; align-items:center; gap:8px; background:var(--brand-2); color:var(--ink); border-radius:var(--r-md); padding:8px 12px; font-weight:var(--fw-medium); font-size:var(--fs-md); }
  .intro-demo .idemo-arrow{ color:var(--ink-faint); font-weight:var(--fw-medium); }
  .intro-demo .idemo-shelf{ display:inline-flex; align-items:center; background:var(--surface-3); color:var(--ink-soft); border-radius:var(--r-md); padding:8px 12px; font-weight:var(--fw-medium); font-size:var(--fs-md); }
  .intro-demo .idemo-hint{ text-align:center; color:var(--ink-faint); font-size:var(--fs-sm); margin-top:13px; min-height:18px; }

  /* ---------- Inline rename (share-sheet) ---------- */
  .inline-rename{ display:flex; align-items:center; gap:10px; width:100%; }
  .inline-rename input{ flex:1; min-width:0; border:1px solid var(--line-strong); border-radius:var(--r-sm); background:var(--surface-2); padding:11px 13px; font-size:var(--fs-input); font-family:var(--display); font-weight:var(--fw-medium); letter-spacing:-.01em; -webkit-user-select:text; user-select:text; }
  .inline-rename .ir-save{ flex:0 0 auto; border:0; background:var(--brand); color:var(--on-brand); padding:10px 14px; border-radius:var(--r-md); font-size:var(--fs-md); font-weight:var(--fw-bold); }
  .inline-rename .ir-cancel{ flex:0 0 auto; border:0; background:transparent; color:var(--ink-soft); padding:10px 4px; font-size:var(--fs-md); font-weight:var(--fw-medium); }

  /* ---------- Member-rij in share-sheet kick/leave-knop ---------- */
  .ls-item .lsi-member-action{ flex:0 0 auto; border:0; background:transparent; color:var(--ink-soft); padding:9px 12px; min-height:38px; font-size:var(--fs-md); font-weight:var(--fw-medium); border-radius:var(--r-sm); }
  .ls-item .lsi-member-action.kick:active{ color:var(--danger); background:color-mix(in srgb, var(--danger) 8%, transparent); }
  .ls-item .lsi-member-action.leave:active{ color:var(--danger); background:color-mix(in srgb, var(--danger) 8%, transparent); }
  .ls-item .lsi-member-action.friend-send{ background:var(--brand-2); color:var(--brand); font-weight:var(--fw-medium); padding:9px 16px; }
  .ls-item .lsi-member-action.friend-send:active{ filter:brightness(.96); }

  /* ---------- Section overflow-link ---------- */
  .section .more-link{ background:none; border:0; padding:2px 4px; font-size:var(--fs-sm); font-weight:var(--fw-medium); color:var(--brand); text-transform:none; letter-spacing:0; }
  .section .more-link:active{ opacity:.7; }

  /* ---------- Section collapse (de kop is een echte <button>) ---------- */
  button.section{ width:100%; background:none; border:0; padding:0; text-align:left; cursor:pointer; min-height:0; color:var(--ink-soft); }
  .section.collapsible{ cursor:pointer; user-select:none; -webkit-user-select:none; }
  .section.collapsible .count{ margin-left:auto; }
  .section.collapsible .sec-chevron{ width:14px; height:14px; color:var(--ink-faint); transition:transform var(--dur-base) var(--ease-out); flex:0 0 auto; margin-left:8px; }
  .section.collapsible.collapsed .sec-chevron{ transform:rotate(-90deg); }
  ul.list.collapsed{ display:none; }

  /* ---------- Slide-in voor nieuwe items ---------- */
  @keyframes rowSlideIn{
    from{ opacity:0; transform:translateY(-10px) scale(.97); }
    to{ opacity:1; transform:translateY(0) scale(1); }
  }
  .row.entering{ animation:rowSlideIn var(--dur-slow) var(--ease-out) backwards; }

  /* ---------- Crisper checkmark (path-drawing animation) ---------- */
  .check svg path{ stroke-dasharray:24; stroke-dashoffset:24; }
  .row.done .check svg{ opacity:1; transform:scale(1); }
  .row.done .check svg path{ animation:drawCheck var(--dur-slow) var(--ease-out) forwards; }
  @keyframes drawCheck{ from{ stroke-dashoffset:24; } to{ stroke-dashoffset:0; } }

  /* ---------- Rich undo-toast ---------- */
  .toast{ display:inline-flex; align-items:center; gap:0; width:max-content; max-width:min(calc(100% - 32px), 520px); white-space:normal; text-align:left; line-height:1.35; }
  .toast .toast-action{ flex:0 0 auto; white-space:nowrap; }
  .toast .toast-msg{ flex:1; }
  .toast .toast-action{ background:transparent; border:0; color:color-mix(in srgb, var(--brand) 80%, var(--bg)); font-weight:var(--fw-bold); padding:6px 12px; margin-left:10px; border-radius:var(--r-sm); font-size:var(--fs-md); letter-spacing:.01em; }
  .toast.has-action{ padding:9px 8px 9px 18px; }
  .toast.has-tap{ cursor:pointer; }
  /* tweede slot: boven de actie-toast (bij top-positie: eronder) */
  .toast-2{ margin-bottom:56px; z-index:96; }
  body.sheet-open .toast-2, .shop-screen.show ~ .toast-2{ margin-bottom:0; margin-top:56px; }
  /* Klaar!-blad */
  .fin-sum{ font-size:var(--fs-lg); color:var(--ink-soft); margin:2px 0 16px; }
  .fin-sum b{ color:var(--ink); font-weight:var(--fw-bold); }
  .fin-paid{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0 0 16px; font-size:var(--fs-md); }
  .fin-paid-in{ display:inline-flex; align-items:center; gap:4px; background:var(--surface-2); border:1px solid var(--line-strong); border-radius:var(--r-sm); padding:6px 10px; color:var(--ink-soft); }
  .fin-paid-in input{ width:7ch; border:0; background:transparent; font-size:var(--fs-input); color:var(--ink); outline:0; text-align:right; -webkit-user-select:text; user-select:text; }
  .toast .toast-action:active{ background:color-mix(in srgb, var(--brand) 22%, transparent); }

  /* ---------- Co-purchase suggestion (onder add-bar) ---------- */
  .co-suggest{ display:flex; align-items:center; gap:8px; margin:8px 0 4px; padding:0 2px; font-size:var(--fs-sm); color:var(--ink-soft); animation:rowSlideIn var(--dur-slow) var(--ease-out) backwards; }
  .co-suggest.hide{ display:none; }
  .co-suggest .cs-lbl{ font-weight:var(--fw-medium); flex:0 0 auto; }
  .co-suggest .cs-pill{ display:inline-flex; align-items:center; gap:5px; background:var(--brand-2); color:var(--brand); border:0; border-radius:var(--r-pill); padding:5px 11px; font-size:var(--fs-sm); font-weight:var(--fw-bold); transition:transform var(--dur-instant) var(--ease-out); }
  .co-suggest .cs-pill:active{ transform:var(--press); filter:brightness(.96); }
  .co-suggest .cs-pill .plus{ font-weight:var(--fw-bold); font-size:var(--fs-md); line-height:1; }
  .co-suggest .cs-close{ margin-left:auto; border:0; background:transparent; color:var(--ink-faint); font-size:var(--fs-base); line-height:1; padding:4px 6px; border-radius:50%; }
  .co-suggest .cs-close:active{ background:var(--surface-3); }

  /* ---------- Prijs-hint in item-sheet ---------- */
  .price-hint{ font-size:var(--fs-xs); color:var(--ink-faint); margin:-6px 4px 12px; font-weight:var(--fw-medium); letter-spacing:.01em; }
  .price-hint b{ color:var(--ink-soft); font-weight:var(--fw-medium); }

  /* ---------- Auto-add badge in Vaste-rij ---------- */
  .vrow .vauto{ flex:0 0 auto; font-size:var(--fs-xs); font-weight:var(--fw-bold); color:var(--brand); background:var(--brand-2); padding:3px 7px; border-radius:var(--r-pill); margin-right:6px; letter-spacing:.04em; text-transform:uppercase; }
  .auto-add-toggle{ display:flex; align-items:center; gap:12px; padding:12px 4px 4px; }
  .auto-add-toggle .aat-label{ flex:1; font-size:var(--fs-md); }
  .auto-add-toggle .aat-label small{ display:block; font-size:var(--fs-xs); color:var(--ink-soft); margin-top:2px; }

  /* ---------- Hero empty-state ---------- */
  .empty.hero .ico{ width:clamp(150px, 38vw, 220px); height:auto; aspect-ratio:120/110; background:transparent; border-radius:0; }
  .empty.hero .ico svg{ width:100%; height:100%; color:var(--ink-decorative); opacity:1; }
  .empty.hero h2{ margin-top:6px; }

  /* ---------- Delight (Fase 3) ---------- */
  /* Confetti — subtiel, kort, brand-kleuren */
  .confetti-layer{ position:absolute; inset:0; pointer-events:none; z-index:90; overflow:hidden; }
  .confetti-bit{ position:absolute; top:-12px; width:8px; height:10px; border-radius:2px; opacity:0; will-change:transform,opacity; animation:confetti-fall var(--dur-celebrate) var(--ease-out) forwards; }
  @keyframes confetti-fall{
    0%{ opacity:1; transform:translateY(-10px) rotate(0deg); }
    100%{ opacity:0; transform:translateY(70vh) rotate(360deg); }
  }
  /* Fly-to-avatar — item vliegt naar de vriend-avatar bij versturen */
  .fly-bit{ position:absolute; z-index:96; pointer-events:none; background:var(--brand); color:var(--on-brand); font-size:var(--fs-sm); font-weight:var(--fw-medium); padding:6px 12px; border-radius:var(--r-pill); box-shadow:var(--el-2); white-space:nowrap; will-change:transform,opacity; }
  /* Presence — "kijkt mee" pulserende stip op online leden */
  .av.live{ position:relative; }
  .av.live::after{ content:""; position:absolute; right:-1px; bottom:-1px; width:9px; height:9px; border-radius:50%; background:var(--brand); border:2px solid var(--bg); animation:live-pulse 2s ease-in-out infinite; }
  @keyframes live-pulse{ 0%,100%{ box-shadow:0 0 0 0 color-mix(in srgb, var(--brand) 50%, transparent);} 50%{ box-shadow:0 0 0 5px transparent;} }
  .presence-bar{ display:flex; align-items:center; gap:7px; margin:2px 4px 8px; font-size:var(--fs-sm); color:var(--brand); font-weight:var(--fw-medium); animation:rowSlideIn var(--dur-slow) var(--ease-out) backwards; }
  .presence-bar.empty{ display:none; }
  .presence-bar .pb-dot{ width:8px; height:8px; border-radius:50%; background:var(--brand); flex:0 0 auto; animation:live-pulse 2s ease-in-out infinite; }

  @media (prefers-reduced-motion: reduce){
    /* Decoratieve beweging uit; essentiële feedback (vinkje, sheet-positie) blijft als korte cross-fade */
    .confetti-bit, .fly-bit{ display:none !important; }
    .view.active, .ac-list.show, .row.entering, .co-suggest, .presence-bar, .shop-screen.show{ animation:none !important; }
    .av.live::after, .presence-bar .pb-dot, .ptr.spin svg{ animation:none !important; }
    .check svg path{ stroke-dashoffset:0 !important; animation:none !important; }
    .sheet, .sheet.show{ transition:opacity var(--dur-fade) linear, visibility 0s !important; transform:none !important; opacity:0; }
    .sheet.show{ opacity:1; }
    .scrim{ transition:opacity var(--dur-fade) linear !important; }
  }

  @media (max-width:359px){
    :root{
      --app-max-width: calc(100vw - 4px);
      --app-padding: clamp(10px, 2.2vw, 12px);
      --tap-size: clamp(38px, 13vw, 42px);
      --tap-size-sm: clamp(28px, 10vw, 31px);

      --subhead-size: 12px;
      --body-size: 16px;
      --totals-space: 172px;
    }
    .topbar{ height:calc(var(--safe-t) + 46px); }
    .largehead{ padding-top:calc(var(--safe-t) + 44px); }
    .addwrap{ left:max(8px, env(safe-area-inset-left)); right:max(8px, env(safe-area-inset-right)); }
    .topbar .share-top,
    .topbar .gear{ top:calc(var(--safe-t) + 6px); }
    .ctitle{ font-size:var(--fs-lg); }
  }

  /* ---------- Telefoon-landschap (844x390, 932x430): compacte kop, bredere kaart, sheet als dialoog ---------- */
  @media (max-height:480px) and (orientation:landscape){
    :root{ --tap-size:40px; --tap-size-sm:34px; --totals-space:150px; --app-max-width:min(760px, calc(100vw - 48px)); }
    h1{ font-size:var(--fs-2xl); }
    .topbar{ height:calc(var(--safe-t) + 42px); }
    .topbar .gear, .topbar .share-top{ top:calc(var(--safe-t) + 3px); }
    .topbar .offline-badge{ top:calc(var(--safe-t) + 10px); }
    .largehead{ padding:calc(var(--safe-t) + 46px) 4px 2px; display:flex; flex-wrap:wrap; align-items:center; gap:2px 16px; }
    .largehead h1{ margin:0; order:0; }
    .largehead .view-seg{ order:1; margin:0 0 0 auto; }
    .largehead .subhead{ order:2; flex-basis:100%; }
    #list-switch-wrap{ order:3; flex-basis:100%; }
    .addwrap{ bottom:calc(max(var(--app-padding), var(--safe-b)) + 6px); }
    .pad-bottom{ height:calc(var(--safe-b) + 76px); }
    .ac-list{ max-height:42vh; }
    .emoji-picker{ grid-template-columns:repeat(12, 1fr); }
    .shop-enter-btn{ padding:10px; margin-bottom:10px; }
    .section{ margin-top:14px; }
    .empty{ padding:24px 20px; }
    #open-list{ display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); column-gap:20px; align-items:start; }
  }

  /* ---------- Rasters vanaf 768px (zonder hoogte-guard: ook lage desktop-vensters) ---------- */
  @media (min-width:768px){
    #open-list{ display:grid; grid-template-columns:repeat(auto-fill, minmax(380px, 1fr)); column-gap:24px; align-items:start; }
    #open-list > .empty, #open-list > .search-empty, #open-list > .quick-start{ grid-column:1 / -1; }
    .quick-start{ max-width:640px; margin-inline:auto; }
    .qs-actions{ flex-direction:row; flex-wrap:wrap; }
    .qs-actions .mbtn{ flex:1 1 220px; }
    #done-list ul.list{ display:grid; grid-template-columns:repeat(auto-fill, minmax(380px, 1fr)); gap:8px 24px; }
    .shop-body{ display:grid; grid-template-columns:repeat(auto-fill, minmax(340px, 1fr)); gap:0 20px; align-content:start; align-items:start; }
    .shop-body > .shop-empty, .shop-body > .shop-alldone{ grid-column:1 / -1; }
    .shop-foot{ flex-direction:row; align-items:center; }
    .shop-foot .shop-add{ flex:1; }
    .shop-foot-row{ flex:0 0 auto; }
    .shop-foot-row .shop-finish{ min-width:200px; }
    .emoji-picker{ grid-template-columns:repeat(auto-fill, minmax(44px, 1fr)); }
    .send-screen{ padding-inline:max(24px, calc((100% - 600px) / 2)); }
    .empty.hero, .banner{ max-width:560px; margin-inline:auto; }
  }
  /* ---------- Tablet-portret (iPad 768/834): tokens — min-height sluit telefoon-landschap uit ---------- */
  @media (min-width:768px) and (min-height:600px){
    :root{
      --app-max-width: min(840px, calc(100vw - 72px));
      --app-padding: clamp(20px, 4vw, 28px);
      --tap-size: clamp(46px, 7.5vw, 52px);
      --tap-size-sm: clamp(34px, 6vw, 38px);
      --totals-space: 188px;

/* ===== src/overlays.js ===== */
/* ============================================================
   OVERLAYS — overlay-stack, systeem-back, focus, sheet-hulp, toetsenbord
   ============================================================
   Plain-script module: geen export, geen "use strict", alleen function-
   declaraties en `var`. build.js voegt dit bestand BINNEN dezelfde IIFE
   vóór app.js in, dus alles hier is gehoist en overal in de app bereikbaar.
   App-functies waarnaar hier verwezen wordt ($, hideAC, switchTab,
   openShoppingMode, activeTab, state) bestaan pas op runtime — daarom
   overal typeof-guards, nooit op definitie-tijd aanroepen.

   INTEGRATIEPUNTEN (wiring gebeurt in app.js / cloud.js, niet hier):
   ─────────────────────────────────────────────────────────────
   app.js
     openSheetUI()             → modalOpen($("#sheet"), closeSheet)
     closeSheet()              → modalClose($("#sheet"))
     openShoppingMode()        → modalOpen($("#shop-screen"), closeShoppingMode)
     closeShoppingMode()       → modalClose($("#shop-screen"))
     openBarcodeScanScreen()   → modalOpen($("#barcode-screen"), closeBarcodeScanScreen)
     closeBarcodeScanScreen()  → modalClose($("#barcode-screen"))
     initApp()                 → document.addEventListener("keydown", onGlobalKey)
     sheets die hun innerHTML herschrijven (multi-step: intro, bulk, item-sheet)
                               → setSheetContent($("#sheet"), html, closeSheet)
                                 (of: injectSheetX($("#sheet"), closeSheet) ná innerHTML)
   cloud.js
     openSheet2()              → modalOpen($("#sheet2"), closeSheet2)
                                 + injectSheetX(s, closeSheet2) ná innerHTML
     closeSheet2()             → modalClose($("#sheet2"))
     openSendScreen()          → modalOpen($("#send-screen"), <sluitfunctie>, {history:false})
                                 (deep-link-scherm: géén history-entry, anders
                                  sluit Android-back hem meteen weer)
       …en de bijbehorende sluiter → modalClose($("#send-screen"))
   shell.html (CSS, niet hier)
     .sheet-x                  → positie/zichtbaarheid van de X-knop; toon 'm
                                 bijv. alleen bij (hover:hover) and (pointer:fine)
                                 of in de "dialog"/"panel"-layout (zie sheetLayout()).

   GEDRAG IN HET KORT
   ─────────────────────────────────────────────────────────────
   • LIFO-stack `_modals` van {el, close, prevFocus, hist, id}.
   • Eerste overlay maakt #main/#topbar/#addwrap/#totals inert; elke
     volgende overlay maakt de overlay eronder inert. Sluiten herstelt dat.
   • Android/desktop-back: per overlay één history.pushState({mandje:"modal",
     id}). Eén popstate-listener vergelijkt event.state.id met de stack en
     sluit ALLE overlays met een hoger id (LIFO) — robuust tegen ingeslikte
     of samengevoegde popstates. Sluit de UI zelf, dan doet modalClose
     history.back(); komt de sluiting uit een popstate, dan niet (vlag).
   • Focus: na 300 ms naar [autofocus] in de overlay of de overlay zelf;
     bij sluiten terug naar het element dat focus had (mits nog in de DOM
     en niet inert).
   • Toetsenbord (onGlobalKey): Escape-hiërarchie, Tab-trap in de bovenste
     overlay, ⌘/Ctrl+K → naar invoerveld, en zonder overlay/veld: "/" zoeken,
     "n" nieuw item, "w" winkelmodus.
   ============================================================ */

var BG_INERT_SEL = "#main, #topbar, #addwrap, #totals";
var MQ_PANEL  = "(min-width:1024px) and (orientation:landscape), (min-width:1200px)";
var MQ_DIALOG = "(min-width:768px) and (min-height:600px), (max-height:480px) and (orientation:landscape)";
var HAS_POINTER = (function(){
  try{
    return typeof window!=="undefined" && typeof window.matchMedia==="function" &&
           !!window.matchMedia("(hover:hover) and (pointer:fine)").matches;
  }catch(e){ return false; }
})();

var _modals = [];          // LIFO-stack van open overlays
var _modalSeq = 0;         // oplopend uniek id (ook het history-token)
var _popClosing = false;   // true zolang een sluiting uit een popstate komt
var _popBound = false;     // popstate-listener maar 1× binden
/* Sessie-nonce in elk history-token. Na een herlaad blijft history.state van de
   vorige page-load staan (met een id dat hoger kan zijn dan onze verse teller);
   tokens met een andere nonce tellen daarom als "geen token" (id 0). */
var _modalSession = (function(){
  try{ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }catch(e){ return "s"; }
})();

function _q(sel){ return document.querySelector(sel); }
function _qa(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
function _modalIndex(el){
  for(var i=0;i<_modals.length;i++){ if(_modals[i].el===el) return i; }
  return -1;
}
function _setInert(el, on){
  if(!el) return;
  if(on) el.setAttribute("inert",""); else el.removeAttribute("inert");
}
function _setBgInert(on){
  _qa(BG_INERT_SEL).forEach(function(n){ _setInert(n, on); });
}
/* Herstel de inert-laag na een wijziging in de stack: alles onder de top
   inert, de top zelf vrij; zonder overlays is de achtergrond weer vrij. */
function _syncInert(){
  if(!_modals.length){ _setBgInert(false); return; }
  _setBgInert(true);
  for(var i=0;i<_modals.length;i++){ _setInert(_modals[i].el, i<_modals.length-1); }
}
/* id uit een history-state; 0 = geen, vreemde, of verouderde (andere sessie) state. */
function _stateId(st){
  return (st && st.mandje==="modal" && st.s===_modalSession && typeof st.id==="number") ? st.id : 0;
}
function _isInert(node){
  try{ return !!(node && node.closest && node.closest("[inert]")); }catch(e){ return false; }
}

/* ---------- Overlay-stack ---------- */
function modalTop(){ return _modals.length ? _modals[_modals.length-1] : null; }

function modalOpen(el, closeFn, opts){
  if(!el || _modalIndex(el)!==-1) return null;   // dubbele registratie negeren
  opts = opts || {};
  var entry = {
    el: el,
    close: (typeof closeFn==="function") ? closeFn : function(){ modalClose(el); },
    prevFocus: (typeof document!=="undefined") ? document.activeElement : null,
    hist: null,
    id: ++_modalSeq,
    popClosing: false
  };
  if(!el.hasAttribute("role")) el.setAttribute("role","dialog");
  el.setAttribute("aria-modal","true");
  if(!el.hasAttribute("tabindex")) el.setAttribute("tabindex","-1");
  el.removeAttribute("inert");                          // defensief

  _modals.push(entry);
  _syncInert();

  _ensurePopstate();
  if(opts.history!==false && typeof history!=="undefined" && history && typeof history.pushState==="function"){
    try{ history.pushState({mandje:"modal", id:entry.id, s:_modalSession}, ""); entry.hist = entry.id; }catch(e){ entry.hist=null; }
  }

  setTimeout(function(){
    if(modalTop()!==entry) return;                      // intussen gesloten of overdekt
    var active = document.activeElement;
    if(active && el.contains(active)) return;           // overlay heeft al focus
    var target = el.querySelector("[autofocus]") || el;
    try{ target.focus({preventScroll:true}); }catch(e){ try{ target.focus(); }catch(e2){} }
  }, 300);
  return entry;
}

function modalClose(el){
  var idx = _modalIndex(el);
  if(idx===-1) return false;
  var entry = _modals[idx];
  var wasTop = (idx===_modals.length-1);
  _modals.splice(idx,1);

  el.removeAttribute("aria-modal");
  el.removeAttribute("inert");                          // defensief
  _syncInert();

  // History: alleen terug als de sluiting uit de UI komt (niet uit een popstate)
  // en het de bovenste overlay was (anders zou back() de overlay erboven wegpoppen).
  if(entry.hist!=null && !entry.popClosing && !_popClosing && wasTop){
    try{ history.back(); }catch(e){}
  }

  // Focus terug naar waar we vandaan kwamen
  if(wasTop){
    var pf = entry.prevFocus;
    if(pf && pf!==document.body && typeof pf.focus==="function" &&
       document.contains(pf) && !_isInert(pf)){
      try{ pf.focus({preventScroll:true}); }catch(e){ try{ pf.focus(); }catch(e2){} }
    }
  }
  return true;
}

/* Sluit één entry alsof het uit een popstate komt (geen history.back()). */
function _closeFromPop(entry){
  entry.popClosing = true;
  _popClosing = true;
  try{ entry.close(); }catch(e){}
  // Riep de close-functie modalClose niet aan? Dan zelf opruimen.
  if(_modalIndex(entry.el)!==-1) modalClose(entry.el);
  _popClosing = false;
}
function _onPopstate(ev){
  var sid = _stateId(ev ? ev.state : null);
  // Sluit alle overlays met een history-token boven de huidige state, LIFO.
  // Overlays zonder token ({history:false}) blijven staan: die sluit alleen de UI.
  for(var i=_modals.length-1;i>=0;i--){
    var m=_modals[i];
    if(m.hist!=null && m.hist>sid) _closeFromPop(m);
  }
}
function _ensurePopstate(){
  if(_popBound || typeof window==="undefined") return;
  _popBound = true;
  window.addEventListener("popstate", _onPopstate);
}

/* ---------- Sheet-hulpfuncties ---------- */
function sheetLayout(){
  if(typeof window==="undefined" || typeof window.matchMedia!=="function") return "bottom";
  try{
    if(window.matchMedia(MQ_PANEL).matches)  return "panel";
    if(window.matchMedia(MQ_DIALOG).matches) return "dialog";
  }catch(e){}
  return "bottom";
}
var SHEET_X_SVG = '<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>';
function injectSheetX(sheetEl, closeFn){
  if(!sheetEl) return null;
  var btn = sheetEl.querySelector(":scope > .sheet-x") || sheetEl.querySelector(".sheet-x");
  if(!btn){
    btn = document.createElement("button");
    btn.className = "sheet-x";
    btn.type = "button";
    btn.setAttribute("aria-label","Sluiten");
    btn.innerHTML = SHEET_X_SVG;
    sheetEl.insertBefore(btn, sheetEl.firstChild);
  }
  if(!btn._sxBound){
    btn._sxBound = true;
    btn.addEventListener("click", function(ev){
      ev.preventDefault();
      if(typeof closeFn==="function") closeFn();
      else modalClose(sheetEl);
    });
  }
  return btn;
}
function setSheetContent(sheetEl, html, closeFn){
  if(!sheetEl) return null;
  sheetEl.innerHTML = (html==null) ? "" : html;
  injectSheetX(sheetEl, closeFn);
  return sheetEl;
}

/* ---------- Focus-hulp ---------- */
var FOCUSABLE_SEL = 'a[href],area[href],button,input,select,textarea,summary,iframe,' +
                    'audio[controls],video[controls],[contenteditable=""],[contenteditable="true"],[tabindex]';
/* Let op: NIET op offsetParent filteren (jsdom heeft geen layout). */
function focusables(root){
  root = root || document;
  return _qa(FOCUSABLE_SEL, root).filter(function(n){
    if(n.disabled || n.hidden) return false;
    if(n.tagName==="INPUT" && n.type==="hidden") return false;
    if(n.closest && n.closest("[hidden]")) return false;
    if(n.getAttribute("aria-hidden")==="true") return false;
    var ti = n.getAttribute("tabindex");
    if(ti!==null && parseInt(ti,10)===-1) return false;
    return true;
  });
}
function trapTab(e, root){
  if(!root) return;
  var f = focusables(root);
  if(!f.length){ e.preventDefault(); try{ root.focus({preventScroll:true}); }catch(x){} return; }
  var first=f[0], last=f[f.length-1], a=document.activeElement;
  var inside = a && root.contains(a);
  if(e.shiftKey){
    if(!inside || a===first){ e.preventDefault(); try{ last.focus(); }catch(x){} }
  } else {
    if(!inside || a===last){ e.preventDefault(); try{ first.focus(); }catch(x){} }
  }
}
function _isEditable(t){
  if(!t || !t.tagName) return false;
  var tag = t.tagName;
  if(tag==="INPUT" || tag==="TEXTAREA" || tag==="SELECT") return true;
  if(t.isContentEditable) return true;
  try{ return !!(t.closest && t.closest('[contenteditable=""],[contenteditable="true"]')); }catch(e){ return false; }
}
function focusAdd(){
  if(typeof activeTab!=="undefined" && activeTab!=="lijst" && typeof switchTab==="function"){
    try{ switchTab("lijst"); }catch(e){}
  }
  var inp = _q("#add-name"); if(!inp) return;
  try{ inp.focus({preventScroll:true}); }catch(e){ try{ inp.focus(); }catch(e2){} }
  try{ inp.select(); }catch(e){}
}
function focusSearchOrAdd(){
  var bar = _q("#search-bar"), si = _q("#search-input");
  var searchVisible = !!(si && bar && !bar.classList.contains("collapsed") && !bar.hidden);
  if(searchVisible){
    try{ si.focus({preventScroll:true}); }catch(e){ try{ si.focus(); }catch(e2){} }
    try{ si.select(); }catch(e){}
    return;
  }
  focusAdd();
}

/* ---------- Toetsenbordlaag (bind op document in initApp) ---------- */
function onGlobalKey(e){
  if(!e || e.defaultPrevented || e.isComposing) return;
  var key = e.key;
  var top = modalTop();
  var t = e.target;
  var inField = _isEditable(t);

  if(key==="Escape" || key==="Esc"){
    var ac = _q("#ac-list");
    if(ac && ac.classList.contains("show") && typeof hideAC==="function"){ e.preventDefault(); hideAC(); return; }
    if(top){ e.preventDefault(); top.close(); return; }
    var si = _q("#search-input");
    if(si && document.activeElement===si){
      e.preventDefault();
      if(si.value){
        si.value = "";
        try{ si.dispatchEvent(new Event("input",{bubbles:true})); }catch(x){}
      } else {
        try{ si.blur(); }catch(x){}
      }
      return;
    }
    if(inField && typeof t.blur==="function"){ try{ t.blur(); }catch(x){} }
    return;
  }

  if(key==="Tab" && top){ trapTab(e, top.el); return; }

  if((e.metaKey || e.ctrlKey) && !e.altKey && (key==="k" || key==="K")){
    e.preventDefault();
    if(top) top.close();
    focusAdd();
    return;
  }

  // Enkel-toets-snelkoppelingen: alleen buiten velden, zonder overlay en zonder modifier
  if(inField || top || e.metaKey || e.ctrlKey || e.altKey) return;
  if(key==="/"){ e.preventDefault(); focusSearchOrAdd(); return; }
  if(key==="n"){ e.preventDefault(); focusAdd(); return; }
  if(key==="w"){
    if(typeof openShoppingMode!=="function") return;
    if(typeof activeTab==="undefined" || activeTab!=="lijst") return;
    if(typeof state==="undefined" || !state || !state.list || !state.list.some(function(i){ return !i.done; })) return;
    e.preventDefault();
    openShoppingMode();
    return;
  }
}

/* ---------- Exports voor de tests ---------- */
if(typeof window!=="undefined"){
  window.modalOpen=modalOpen; window.modalClose=modalClose; window.modalTop=modalTop;
  window.sheetLayout=sheetLayout; window.__HAS_POINTER=HAS_POINTER;
  window.onGlobalKey=onGlobalKey; window.setSheetContent=setSheetContent;
}

var FLAT_KW = [];
Object.keys(KW).forEach(function(cat){ KW[cat].forEach(function(w){ FLAT_KW.push({w:w, cat:cat}); }); });
FLAT_KW.sort(function(a,b){ return b.w.length - a.w.length; });

function norm(s){ return (s||"").toString().trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""); }
/* Vergelijkingssleutel voor dubbele regels: koppeltekens/underscores → spatie, meervoudige spaties → één */
function matchKey(s){ return norm(s).replace(/[-_\/]+/g," ").replace(/\s+/g," ").trim(); }

function lev(a,b){
  var m=a.length,n=b.length; if(Math.abs(m-n)>1) return 2;
  var prev=[],cur=[],i,j;
  for(j=0;j<=n;j++) prev[j]=j;
  for(i=1;i<=m;i++){
    cur[0]=i;
    for(j=1;j<=n;j++){
      var c=a.charAt(i-1)===b.charAt(j-1)?0:1;
      cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+c);
    }
    for(j=0;j<=n;j++) prev[j]=cur[j];
  }
  return prev[n];
}
function classify(name){
  var n = norm(name);
  if(!n) return "overig";
  // Respecteer een handmatige categorie-correctie (userOverrideCat) → corrigeren is blijvend
  if(typeof state!=="undefined" && state && state.catalog){
    var ce = state.catalog[n];
    if(ce && ce.userOverrideCat && ce.category) return ce.category;
  }
  var words = n.split(/\s+/);
  // Score elke treffer: exact +200, aan het einde van de naam +100 ("boterhamworst" → worst, "melkchocolade" → chocolade),
  // op een woordgrens +50, lengte als tiebreak. Korte woorden (<4) tellen alleen als heel woord.
  var best=null, bestScore=0;
  for(var i=0;i<FLAT_KW.length;i++){
    var w = FLAT_KW[i].w;
    var idx = n.indexOf(w); if(idx===-1) continue;
    var isWord = words.indexOf(w) !== -1;
    if(w.length < 4 && !isWord) continue;
    var endsAt = idx + w.length;
    var bStart = idx===0 || /[\s-]/.test(n.charAt(idx-1));
    var bEnd = endsAt===n.length || /[\s-]/.test(n.charAt(endsAt));
    var score = w.length;
    if(n===w) score += 200;
    if(endsAt===n.length) score += 100;
    if(bStart && bEnd) score += 50;
    if(score > bestScore){ bestScore=score; best=FLAT_KW[i].cat; }
  }
  if(best) return best;
  // typefout-tolerant: 1 teken verschil op een heel woord (min. 5 tekens)
  for(var wi=0;wi<words.length;wi++){
    var word=words[wi]; if(word.length<5) continue;
    for(var k=0;k<FLAT_KW.length;k++){
      var kw=FLAT_KW[k].w;
      if(kw.length<5) continue;
      if(Math.abs(kw.length-word.length)<=1 && lev(word,kw)<=1) return FLAT_KW[k].cat;
    }
  }
  return "overig";
}

function deepClone(o){ return JSON.parse(JSON.stringify(o)); }

function normalizeState(raw){

    version: CURRENT_STATE_VERSION,
    settings: Object.assign({}, DEFAULTS.settings, isPlainObject(inState.settings) ? inState.settings : {}),

    history: Array.isArray(inState.history) ? inState.history.filter(isPlainObject).slice(0, 200) : []
  });
  out.localMutationEpoch = Number(inState.localMutationEpoch) || 0;
  out._cloudOpenEpoch = Number(inState._cloudOpenEpoch) || 0;
  if(Array.isArray(inState.list)){
    for(var i=0;i<inState.list.length;i++){
      var it = inState.list[i];
      if(!isPlainObject(it)) continue;
      out.list.push({

        added_by_name: it.added_by_name || "",
        addedAt: it.addedAt || nowISO()

  }
  if(!Array.isArray(out.settings.categoryOrder)) out.settings.categoryOrder = DEFAULTS.settings.categoryOrder.slice();
  if(!Array.isArray(out.settings.customCategories)) out.settings.customCategories = [];
  if(!isPlainObject(out.settings.customCatEmoji)) out.settings.customCatEmoji = {};
  CATS.forEach(function(c){ if(out.settings.categoryOrder.indexOf(c.id)===-1) out.settings.categoryOrder.push(c.id); });
  out.settings.customCategories.forEach(function(c){ if(c && c.id && out.settings.categoryOrder.indexOf(c.id)===-1) out.settings.categoryOrder.push(c.id); });
  // winkels: geldige lijst, elke looproute bevat alle schappen (nieuwe schappen achteraan)
  out.settings.stores = (Array.isArray(out.settings.stores) ? out.settings.stores : []).filter(function(s){ return isPlainObject(s) && s.id && s.name; }).map(function(s){
    var order = Array.isArray(s.order) ? s.order.filter(function(cid){ return out.settings.categoryOrder.indexOf(cid)!==-1; }) : [];

function shouldAcceptCloudList(items, opts){
  opts = opts || {};
  var itemEpoch = Number(opts.openLocalEpoch || 0);
  var now = Date.now ? Date.now() : 0;
  var openStartedAt = Number(opts.openStartedAt || 0);
  var localEpoch = (typeof window !== "undefined" && typeof window.__mandjeLocalMutationEpoch === "number") ? window.__mandjeLocalMutationEpoch : _localMutationEpoch;
  if(itemEpoch && localEpoch && localEpoch > itemEpoch && openStartedAt && now - openStartedAt < 2500){

/* ---- IndexedDB-vangnet (onzichtbaar): checkpoint van de hele state, voor het geval
   localStorage wordt gewist/gepurged (iOS 7-dagen, quota, reset). Faalt stil. ---- */
function idbSet(key, valStr){
  try{
    if(typeof indexedDB==="undefined") return;
    var req=indexedDB.open("mandje-bak",1);
    req.onupgradeneeded=function(){ try{ req.result.createObjectStore("kv"); }catch(e){} };
    req.onsuccess=function(){ try{ var db=req.result; db.transaction("kv","readwrite").objectStore("kv").put(valStr,key); }catch(e){} };
  }catch(e){}
}
function idbGet(key){
  return new Promise(function(res){
    try{
      if(typeof indexedDB==="undefined"){ res(null); return; }
      var req=indexedDB.open("mandje-bak",1);
      req.onupgradeneeded=function(){ try{ req.result.createObjectStore("kv"); }catch(e){} };
      req.onsuccess=function(){ try{ var g=req.result.transaction("kv","readonly").objectStore("kv").get(key); g.onsuccess=function(){res(g.result||null);}; g.onerror=function(){res(null);}; }catch(e){ res(null); } };
      req.onerror=function(){ res(null); };
    }catch(e){ res(null); }
  });
}
/* Herstel localStorage uit het IndexedDB-checkpoint als 't leeg/corrupt is — vóór load(). */
function ensureRestore(){
  return new Promise(function(res){
    var raw=null; try{ raw=localStorage.getItem(NS); }catch(e){}
    var parsed = safeParse(raw);
    if(parsed && isPlainObject(parsed)){ res(); return; }
    idbGet(NS).then(function(backup){
      if(backup){
        var restored = safeParse(backup);
        if(restored && isPlainObject(restored)){ try{ localStorage.setItem(NS, JSON.stringify(restored)); }catch(e){} }
      }
      res();
    });
  });
}

function load(){
  var raw = null, parsed = null;
  try{ raw = localStorage.getItem(NS); }catch(e){}
  if(raw){
    try{ parsed = JSON.parse(raw); }catch(e){ parsed = null; }
  }
  if(parsed && typeof parsed === "object"){
    state = normalizeState(parsed);
    var loadedAt = Date.now ? Date.now() : 0;
    state._meta = Object.assign({}, state._meta || {}, {
      lastLoadedAt: loadedAt,
      restoreMode: typeof Cloud !== "undefined" && Cloud && Cloud.active ? "cloud-suspended" : "local"
    });
    var savedLocalMutation = Number(state._meta.localMutationEpoch) || 0;
    _cloudRestoreGuard = Math.max(_cloudRestoreGuard, savedLocalMutation);
    if(typeof state._meta.restoreMode === "string" && state._meta.restoreMode.indexOf("cloud") !== -1){
      var safeWindow = (loadedAt - Number(state._meta.lastCloudOpenAt || 0)) < 9000;
      if(safeWindow && Array.isArray(_personalList)){
        state.list = _personalList.slice();
      }
    }
    // Bescherming tegen init-race: bewaar een lokale snapshot wanneer cloud juist actief is.
    if(state._meta.restoreMode === "cloud-suspended" && typeof Cloud !== "undefined" && Cloud && Cloud.active && Array.isArray(_personalList) && savedLocalMutation >= _cloudRestoreGuard){
      state.list = _personalList.slice();
    }
    if(state._meta.localMutationEpoch){
      _localMutationEpoch = state._meta.localMutationEpoch;
      if(typeof window !== "undefined") window.__mandjeLocalMutationEpoch = _localMutationEpoch;
    }
    rebuildCatIndex();
    return;
  }
  // geen geldige v2-data -> eenmalige migratie vanaf v1
  state = deepClone(DEFAULTS);
  try{
    var oldItems = JSON.parse(localStorage.getItem("mandje.items.v1")||"null");
    if(Array.isArray(oldItems)){
      oldItems.forEach(function(it){
        state.list.push({ id:uid(), name:it.name, category:classify(it.name), qty:it.qty||1, price:(it.price==null?null:it.price), note:"", done:!!it.done, addedAt:nowISO() });
        touchCatalog(it.name, it.price);
      });
    }
  }catch(e){}
  rebuildCatIndex();
  save();
}

function save(){

    // daarvan de persoonlijke lijst, zodat terugschakelen naar Persoonlijk 'm intact houdt.

    }
    var str = JSON.stringify(snap);
    localStorage.setItem(NS, str);
    // Onzichtbaar vangnet: hooguit elke ~8s naar IndexedDB checkpointen
    var now = (Date.now ? Date.now() : 0);
    if(now - _idbCheckpointAt > 8000){ _idbCheckpointAt = now; idbSet(NS, str); }
  }catch(e){}
  if(!navigator.onLine && typeof refreshOfflineBadge === "function") refreshOfflineBadge();
}

/* ============================================================
   CATALOG — leer-database per product
   ============================================================ */
function touchCatalog(name, price){
  var k = norm(name);
  if(!k) return null;
  var e = state.catalog[k];
  if(!e){
    e = { name:name.trim(), category:classify(name), defaultPrice:(price==null?null:price), purchaseDates:[], timesAdded:0, lastAddedAt:null, cadenceMode:"auto", manualIntervalDays:null };
    state.catalog[k]=e;
  }
  e.name = name.trim();
  if(price!=null) e.defaultPrice = price;
  e.timesAdded = (e.timesAdded||0)+1;
  e.lastAddedAt = nowISO();
  return e;
}

function recordPurchase(name, price){
  var k = norm(name); var e = state.catalog[k];
  if(!e){ e = touchCatalog(name, price); }
  var today = todayStr();
  e.purchaseDates = e.purchaseDates||[];
  // niet dubbel op dezelfde dag
  if(e.purchaseDates[e.purchaseDates.length-1] !== today) e.purchaseDates.push(today);
  if(price!=null) e.defaultPrice = price;
}

/* Co-purchase: alle paren in dezelfde finish-sessie krijgen +1 count.
   Gebruikt om "Vaak samen: + brood"-suggesties te tonen. */
function recordCoBuy(names){
  if(!Array.isArray(names) || names.length < 2) return;
  state.coBuy = state.coBuy || {};
  var keys = names.map(norm).filter(Boolean);
  // unique
  var seen={}, uniq=[];
  keys.forEach(function(k){ if(!seen[k]){ seen[k]=1; uniq.push(k); } });
  for(var i=0; i<uniq.length; i++){
    for(var j=0; j<uniq.length; j++){
      if(i===j) continue;
      state.coBuy[uniq[i]] = state.coBuy[uniq[i]] || {};
      state.coBuy[uniq[i]][uniq[j]] = (state.coBuy[uniq[i]][uniq[j]]||0) + 1;
    }
  }
}
function getCoSuggestions(key, limit){
  var co = (state.coBuy||{})[key];
  if(!co) return [];
  var onListKeys = state.list.filter(function(i){return !i.done;}).map(function(i){return norm(i.name);});
  var out = [];
  Object.keys(co).forEach(function(k){
    if(co[k] < 3) return;
    if(onListKeys.indexOf(k) !== -1) return;
    var cat = state.catalog[k]; if(!cat) return;
    out.push({key:k, name:cat.name, count:co[k]});
  });
  out.sort(function(a,b){ return b.count - a.count; });
  return out.slice(0, limit||2);
}
var _coSuggestT;
function renderCoSuggest(triggerKey){
  var wrap = $("#co-suggest"); if(!wrap) return;
  if(activeTab!=="lijst" || !triggerKey){ wrap.classList.add("hide"); wrap.innerHTML=""; return; }

/* ============================================================
   CADENCE — analyse + due-detectie
   ============================================================ */
function todayStr(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function pad(n){ return (n<10?"0":"")+n; }
function parseDay(s){ return new Date(s+"T00:00:00"); }
function dayDiff(a,b){ return Math.round((b-a)/86400000); }
function addDays(d,n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()+Math.round(n)); }
function nowISO(){ return new Date().toISOString(); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function analyse(e){
  var s = state.settings;
  var ds = (e.purchaseDates||[]).slice().sort();
  var last = ds.length ? parseDay(ds[ds.length-1]) : null;
  var today = parseDay(todayStr());

  if(e.cadenceMode === "off"){ return {mode:"off", regular:false, last:last}; }

  if(e.cadenceMode === "manual" && e.manualIntervalDays){
    var iv = e.manualIntervalDays;
    var next = last ? addDays(last, iv) : today;
    var overdue = last ? (dayDiff(next, today))/iv : 1;
    return { mode:"manual", interval:iv, mean:iv, last:last, next:next, overdue:overdue, regular:true };
  }

  if(ds.length < 2){ return { mode:"auto", regular:false, last:last, count:ds.length }; }
  var gaps=[]; for(var i=1;i<ds.length;i++){ gaps.push(dayDiff(parseDay(ds[i-1]), parseDay(ds[i]))); }
  var mean = gaps.reduce(function(a,b){return a+b;},0)/gaps.length;
  var variance = gaps.reduce(function(a,b){return a+(b-mean)*(b-mean);},0)/gaps.length;
  var sd = Math.sqrt(variance);
  var cv = mean ? sd/mean : Infinity;
  var nextA = addDays(last, mean);
  var overdueA = mean ? (dayDiff(nextA, today))/mean : 0;
  var regular = (ds.length >= s.minPurchases) && (cv < s.cvThreshold) && mean >= 1;
  return { mode:"auto", mean:mean, cv:cv, last:last, next:nextA, overdue:overdueA, regular:regular, count:ds.length };
}

function isDue(a){
  if(!a.regular || !a.next) return false;
  // Handmatig ritme zonder koopgeschiedenis: er is nog geen ankerpunt, dus nog niet "bijna op".
  // Het item blijft wel zichtbaar onder "Jouw vaste boodschappen" tot de eerste aankoop.
  if(a.mode==="manual" && !a.last) return false;
  var today = parseDay(todayStr());
  var threshold = addDays(a.next, -state.settings.dueWindowDays);
  return today.getTime() >= threshold.getTime();
}

// items die "bijna op" zijn en nog niet open op de lijst staan
function getDueItems(){
  var openKeys = {};
  state.list.forEach(function(it){ if(!it.done) openKeys[norm(it.name)]=true; });
  var today = todayStr();
  var dismissed = (state.settings && state.settings.dismissedDueItems) || {};
  var out=[];
  Object.keys(state.catalog).forEach(function(k){
    if(openKeys[k]) return;
    if(dismissed[k] === today) return; // vandaag weggetikt → niet tonen, morgen weer
    var e=state.catalog[k];
    if(e.hidden) return;                                   // "niet meer voorstellen"
    if(e.snoozeUntil && e.snoozeUntil >= today) return;   // uitgesteld (lang indrukken op de chip)
    var a=analyse(e);
    if(isDue(a)) out.push({key:k, e:e, a:a});
  });
  out.sort(function(x,y){ return y.a.overdue - x.a.overdue; });
  return out;
}
function dismissDueItem(k){
  if(!state.settings.dismissedDueItems) state.settings.dismissedDueItems = {};
  state.settings.dismissedDueItems[k] = todayStr();
  save(); renderDueBanner();
}
function snoozeDue(k, days){
  var e=state.catalog[k]; if(!e) return;
  var d=addDays(parseDay(todayStr()), days||7);
  e.snoozeUntil = d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  save(); renderDueBanner(); if(activeTab==="vaste") renderVaste();
  toast(e.name+" uitgesteld — "+(days===7?"volgende week":days+" dagen")+" niet meer vragen", {duration:2600, action:"Ongedaan", onAction:function(){ delete e.snoozeUntil; save(); renderDueBanner(); if(activeTab==="vaste") renderVaste(); }});
}
function dismissDueBanner(){
  var due = getDueItems(); if(!due.length) return;
  if(!state.settings.dismissedDueItems) state.settings.dismissedDueItems = {};
  var today = todayStr();
  due.forEach(function(d){ state.settings.dismissedDueItems[d.key] = today; });
  // oude dismissals van vorige dagen opruimen zodat het object niet groeit
  Object.keys(state.settings.dismissedDueItems).forEach(function(k){
    if(state.settings.dismissedDueItems[k] !== today) delete state.settings.dismissedDueItems[k];
  });
  save(); renderDueBanner();
}

/* Auto-add: items met autoAdd=true die NU due zijn, max 1× per dag,
   nooit dubbel toevoegen wanneer al op de lijst. Lokaal alleen. */
function runAutoAddDueItems(){
  if(typeof Cloud!=="undefined" && Cloud.active) return;
  var due = getDueItems(); if(!due.length) return;
  var addedNames = [];
  var nowMs = (typeof Date !== "undefined" && Date.now) ? Date.now() : 0;
  due.forEach(function(d){
    var e = d.e; if(!e.autoAdd) return;
    var k = norm(e.name);
    if(state.list.some(function(i){ return !i.done && norm(i.name)===k; })) return;
    var last = e.lastAutoAddAt ? new Date(e.lastAutoAddAt).getTime() : 0;
    if(nowMs - last < 86400 * 1000) return;
    state.list.unshift({
      id:uid(), name:e.name, category:e.category||"overig", qty:1,
      price:(state.settings.showPrices?e.defaultPrice:null),
      note:"", done:false, addedAt:nowISO()
    });
    e.lastAutoAddAt = nowISO();
    addedNames.push(e.name);
  });
  if(addedNames.length){
    save(); renderLijst(); renderDueBanner();
    var msg = addedNames.length===1
      ? addedNames[0]+" automatisch toegevoegd"
      : addedNames.length+" vaste boodschappen automatisch toegevoegd";
    toast(msg);
  }
}

/* Vaak gekocht: catalog-items op timesAdded × recency (laatst toegevoegd < 30 dagen weegt zwaarder), niet al open op de lijst */
function frequentItems(limit){
  var open={}; state.list.forEach(function(i){ if(!i.done) open[norm(i.name)]=1; });
  var now=Date.now(), out=[];
  Object.keys(state.catalog||{}).forEach(function(k){
    var e=state.catalog[k]; if(!e || e.hidden || open[k]) return;
    var times=(e.timesAdded||0) + (e.purchaseDates||[]).length;
    if(times < 2) return;
    var days = e.lastAddedAt ? (now - new Date(e.lastAddedAt).getTime())/86400000 : 365;
    var score = times * (1 / (1 + Math.max(0,days)/30));
    out.push({key:k, e:e, score:score});
  });
  out.sort(function(a,b){ return b.score - a.score; });
  return out.slice(0, limit||8).map(function(x){ return x.e; });
}

/* ---------- Catalogusbeheer: hernoemen (met samenvoegen), verbergen, verwijderen ---------- */
function renameCatalogEntry(oldKey, newName){
  newName=(newName||"").trim(); if(!newName) return false;
  var e=state.catalog[oldKey]; if(!e) return false;
  var newKey=norm(newName);
  if(newKey===oldKey){ e.name=newName; save(); return true; }
  var t=state.catalog[newKey];
  if(t){
    var seen={}; t.purchaseDates=(t.purchaseDates||[]).concat(e.purchaseDates||[]).filter(function(d){ if(seen[d]) return false; seen[d]=1; return true; }).sort();
    t.timesAdded=(t.timesAdded||0)+(e.timesAdded||0);
    if(t.defaultPrice==null && e.defaultPrice!=null) t.defaultPrice=e.defaultPrice;
    if(!t.lastAddedAt || (e.lastAddedAt && e.lastAddedAt>t.lastAddedAt)) t.lastAddedAt=e.lastAddedAt;
    t.name=newName;
  } else { e.name=newName; state.catalog[newKey]=e; }
  delete state.catalog[oldKey];
  if(state.coBuy && state.coBuy[oldKey]){ var co=state.coBuy[oldKey]; delete state.coBuy[oldKey]; state.coBuy[newKey]=Object.assign(state.coBuy[newKey]||{}, co); }
  Object.keys(state.coBuy||{}).forEach(function(k){ var m=state.coBuy[k]; if(m && m[oldKey]!=null){ m[newKey]=(m[newKey]||0)+m[oldKey]; delete m[oldKey]; } });
  state.list.forEach(function(i){ if(norm(i.name)===oldKey) i.name=newName; });
  save();
  if(activeTab==="lijst") renderLijst();
  return true;
}

function getRecurring(){
  var out=[];
  Object.keys(state.catalog).forEach(function(k){
    var e=state.catalog[k]; if(e.hidden) return;

  });
  // due eerst, dan op naam
  out.sort(function(x,y){
    var dx=isDue(x.a)?1:0, dy=isDue(y.a)?1:0;
    if(dx!==dy) return dy-dx;
    return x.e.name.localeCompare(y.e.name,"nl");
  });
  return out;
}

function cadenceLabel(a){

  }

    if(n<=8 && n>=6) return "Meestal wekelijks";
